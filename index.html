<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สนามทุ่นระเบิด</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#2A1B0E; --paper-2:#43301B; --paper-3:#523B21;
  --ink:#F2E7D2; --ink-2:#C6B08B; --ink-3:#9A8460;
  --rule:#6D5130; --hazard:#D8A72B; --blood:#D9503F; --heal:#78C97C; --cache:#5C4620;
  --brass:#D8A72B; --brass-dark:#8A6512; --wood:#5A3E22; --wood-dark:#1F1409;
  /* ผิววัสดุของกระดาน ธีมเปลี่ยนแค่ชุดนี้ ส่วนสีเตือนกับสีผู้เล่นคงเดิมทุกธีม */
  --tile:#523A1E; --tile-line:#8A6B41; --plank:#6B4E2A; --tie:#7A5A32; --rail:#9AA3AB;
  --outline:#1F1409; --die1:#F0E6D2; --die2:#C9B896;
  --ctrl:#2E1F0E; --ctrl-a:#5B411F; --ctrl-b:#3B2913;
  --veil:rgba(31,20,9,.84); --sheet-a:#59401F; --sheet-b:#3A2712;
  --slow-col:#7FB3E0; --lift-col:#C9A0E8; --gold-ink:#2A1B0E;
  --gold-a:#E4B63C; --gold-b:#B7871A; --emboss:rgba(255,255,255,.07); --shade:rgba(0,0,0,.35);
  --field:linear-gradient(160deg,#33210F 0%,#241708 60%,#2E1D0D 100%);
  --grain1:rgba(255,255,255,.022); --grain2:rgba(0,0,0,.16);
  --stage:radial-gradient(ellipse at 38% 28%,#6B4A28 0%,#4A3218 55%,#33220F 100%);
  --stage-line:rgba(0,0,0,.13);
  --sans:'IBM Plex Sans Thai',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html[data-theme="steel"]{
  --paper:#161A1F; --paper-2:#242A31; --paper-3:#2E353D;
  --ink:#E8EDF2; --ink-2:#A9B4BF; --ink-3:#7C8894; --rule:#46515C;
  --tile:#2E343B; --tile-line:#5A6773; --plank:#39414A; --tie:#4A545F; --rail:#B7C2CC;
  --outline:#0D1014; --die1:#EDF1F5; --die2:#BAC4CE;
  --ctrl:#1D2229; --ctrl-a:#333C46; --ctrl-b:#232A31; --cache:#4A4326;
  --field:linear-gradient(160deg,#1B2028 0%,#12161B 60%,#191E25 100%);
  --grain1:rgba(255,255,255,.03); --grain2:rgba(0,0,0,.18);
  --stage:radial-gradient(ellipse at 38% 28%,#3C444D 0%,#2A313A 55%,#1D2229 100%);
  --stage-line:rgba(0,0,0,.16);
  --veil:rgba(10,13,17,.86); --sheet-a:#333C46; --sheet-b:#232A31;
  --slow-col:#7FB3E0; --lift-col:#C9A0E8; --gold-ink:#151A20;
  --gold-a:#E4B63C; --gold-b:#B7871A; --emboss:rgba(255,255,255,.08); --shade:rgba(0,0,0,.4);
}
html[data-theme="jungle"]{
  --paper:#161C13; --paper-2:#26301F; --paper-3:#313D28;
  --ink:#EBF0E4; --ink-2:#AEBBA0; --ink-3:#84907A; --rule:#4C5B41;
  --tile:#2C3A26; --tile-line:#5C7150; --plank:#3A4A31; --tie:#4E6042; --rail:#A9B79C;
  --outline:#101509; --die1:#F0EEDC; --die2:#C3C4A6;
  --ctrl:#1D2418; --ctrl-a:#37432C; --ctrl-b:#252E1D; --cache:#4E4A20;
  --field:linear-gradient(160deg,#1C2417 0%,#131A0F 60%,#1A2215 100%);
  --grain1:rgba(255,255,255,.025); --grain2:rgba(0,0,0,.17);
  --stage:radial-gradient(ellipse at 38% 28%,#3F5134 0%,#2E3B26 55%,#1F2A1A 100%);
  --stage-line:rgba(0,0,0,.15);
  --veil:rgba(10,14,8,.86); --sheet-a:#37432C; --sheet-b:#252E1D;
  --slow-col:#8FC0E4; --lift-col:#CBA6E6; --gold-ink:#141A0E;
  --gold-a:#E4B63C; --gold-b:#B7871A; --emboss:rgba(255,255,255,.07); --shade:rgba(0,0,0,.38);
}
html[data-theme="slate"]{
  --paper:#17171B; --paper-2:#26262C; --paper-3:#303038;
  --ink:#ECECF0; --ink-2:#ADADB8; --ink-3:#82828E; --rule:#4A4A55;
  --tile:#33333A; --tile-line:#5E5E6A; --plank:#3C3C45; --tie:#4C4C57; --rail:#BCBCC8;
  --outline:#0E0E12; --die1:#F2F2F5; --die2:#C4C4CE;
  --ctrl:#1E1E23; --ctrl-a:#38383F; --ctrl-b:#26262C; --cache:#4A4426;
  --field:linear-gradient(160deg,#1E1E24 0%,#141418 60%,#1A1A20 100%);
  --grain1:rgba(255,255,255,.028); --grain2:rgba(0,0,0,.2);
  --stage:radial-gradient(ellipse at 38% 28%,#42424C 0%,#2E2E36 55%,#202026 100%);
  --stage-line:rgba(0,0,0,.18);
  --veil:rgba(10,10,13,.86); --sheet-a:#38383F; --sheet-b:#26262C;
  --slow-col:#8CBBE6; --lift-col:#CBA6E6; --gold-ink:#16161B;
  --gold-a:#E4B63C; --gold-b:#B7871A; --emboss:rgba(255,255,255,.08); --shade:rgba(0,0,0,.42);
}
/* ธีมเดียวที่พื้นสว่าง จึงต้องสลับไปใช้ชุดสีผู้เล่นอีกชุดด้วย */
html[data-theme="paper"]{
  --paper:#D9D5C3; --paper-2:#E6E3D6; --paper-3:#CFCAB4;
  --ink:#1B1F1A; --ink-2:#4E5344; --ink-3:#5E6252; --rule:#A9A48A;
  --brass:#7A5A0C; --brass-dark:#5C4406; --blood:#9E2B24; --heal:#3F7A4A; --cache:#F0E0AC;
  --tile:#EDEADC; --tile-line:#A9A48A; --plank:#E2DECB; --tie:#BDB79C; --rail:#8A8570;
  --outline:#2A2C22; --die1:#FBF8ED; --die2:#DAD5C0;
  --ctrl:#EFECDF; --ctrl-a:#E4E0D0; --ctrl-b:#D6D2C0;
  --field:linear-gradient(160deg,#E2DFCE 0%,#D4D0BC 60%,#DCD8C6 100%);
  --grain1:rgba(0,0,0,.02); --grain2:rgba(0,0,0,.05);
  --stage:radial-gradient(ellipse at 38% 28%,#F0EDE0 0%,#E1DDCB 55%,#D2CEBA 100%);
  --stage-line:rgba(0,0,0,.05);
  --veil:rgba(60,56,40,.72); --sheet-a:#EFECDF; --sheet-b:#DCD8C6;
  --slow-col:#2A5F8C; --lift-col:#6B3E92; --gold-ink:#2A2410;
  --gold-a:#C79A22; --gold-b:#9A7310; --emboss:rgba(255,255,255,.5); --shade:rgba(90,84,64,.22);
}

body{
  font-family:var(--sans); color:var(--ink); background-color:var(--paper);
  background-image:
    repeating-linear-gradient(93deg,var(--grain1) 0 2px,transparent 2px 7px),
    repeating-linear-gradient(89deg,var(--grain2) 0 1px,transparent 1px 23px),
    var(--field);
  padding:20px 16px 48px; line-height:1.6;
}
.app{max-width:1120px;margin:0 auto}

header{border-bottom:2px solid var(--brass-dark);padding-bottom:10px;margin-bottom:22px}
/* กลุ่มปุ่มมุมขวาต้องขึ้นบรรทัดใหม่ได้ ไม่งั้นบนจอแคบมันจะล้นออกไปจนมองไม่เห็น */
.tools{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}
.langs button#btnLook{color:var(--brass);font-weight:600}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:.22em;margin:0;text-transform:uppercase}
.tagline{font-size:14px;color:var(--ink-2)}
.ver{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--ink-3);margin-top:3px}
.meta{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase;margin-top:4px}
.langs{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;flex:none}
.langs button{font-family:var(--mono);font-size:11px;letter-spacing:.12em;padding:6px 11px;border:0;border-radius:0;
  border-left:1px solid var(--rule);background:var(--ctrl-b);color:var(--ink-2);cursor:pointer}
.langs button:first-child{border-left:0}
.langs button[aria-pressed="true"]{background:linear-gradient(180deg,var(--gold-a),var(--gold-b));color:var(--gold-ink)}

.card{background:var(--paper-2);border:1px solid var(--rule);border-radius:6px;
  box-shadow:inset 0 1px 0 var(--emboss), 0 2px 0 var(--shade);
  background-image:repeating-linear-gradient(91deg,var(--grain1) 0 2px,transparent 2px 8px)}
.card h2{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  margin:0;padding:9px 14px;border-bottom:1px solid var(--rule);color:var(--ink-2)}

.setup{max-width:540px;margin:8px auto}
.setup .body{padding:20px}
.setup p{margin:0 0 16px;color:var(--ink-2);font-size:15px}
.choices{display:flex;gap:8px;margin-bottom:20px}
.choice{flex:1;padding:12px 4px;background:linear-gradient(180deg,var(--ctrl-a),var(--ctrl-b));border:1px solid var(--rule);border-radius:4px;
  cursor:pointer;text-align:center;font-family:var(--mono);font-size:19px;font-weight:600;color:var(--ink);line-height:1.2}
.choice[aria-pressed="true"]{background:linear-gradient(180deg,var(--gold-a),var(--gold-b));color:var(--gold-ink);border-color:var(--brass-dark)}
.choice.dim{opacity:.35;cursor:not-allowed}
.opts{display:grid;gap:8px;margin-bottom:18px}
.opt{display:flex;align-items:center;gap:10px;padding:7px 12px;background:var(--ctrl-b);border:1px solid var(--rule);border-radius:4px}
.opt span{flex:1;font-size:13px;color:var(--ink-2)}
.step{display:flex;align-items:stretch;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--ctrl-b)}
.step button{border:0;border-radius:0;padding:3px 12px;font-family:var(--mono);font-size:16px;background:transparent;color:var(--ink)}
.step button:disabled{opacity:.3}
.step b{font-family:var(--mono);font-size:14px;min-width:32px;text-align:center;padding:4px 0;
  border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
.fieldlbl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-2);margin-bottom:7px}
.adv{border:1px solid var(--rule);border-radius:4px;background:var(--ctrl-b);margin-bottom:18px}
.adv summary{cursor:pointer;padding:9px 13px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-2);list-style:none;display:flex;justify-content:space-between;align-items:center}
.adv summary::-webkit-details-marker{display:none}
.adv summary::after{content:'+';font-size:15px;line-height:1}
.adv[open] summary::after{content:'\2212'}
.adv .advbody{padding:2px 13px 6px}
.adv .opts{margin-bottom:6px}
.proster{display:grid;gap:7px;margin-bottom:18px}
.prow{display:flex;align-items:center;gap:9px}
.pick{font-family:var(--sans);font-size:13px;padding:6px 10px;color:var(--ink);
  background:var(--ctrl);border:1px solid var(--rule);border-radius:4px;cursor:pointer}
/* ผู้เข้าร่วมไม่ได้เป็นคนตั้งค่า จึงหรี่ทุกอย่างที่ไม่ใช่เรื่องของเขาลง
   ยกเว้นแถวห้องรอ ซึ่งยังต้องกดเลือกที่นั่งและออกจากห้องได้ */
.guestlock .choices,.guestlock #teamrow,.guestlock #shaperow,.guestlock #roster,
.guestlock .adv,.guestlock #btnStart{opacity:.45}
.guestlock .adv summary{cursor:not-allowed}
.lockmsg{font-size:12.5px;color:var(--brass);margin:10px 0 0}
/* เข้าห้องคนอื่นแล้ว การตั้งค่าเป็นสิทธิ์ของเจ้าของห้อง
   หรี่และปิดทุกอย่างยกเว้นแถวห้องรอ ปุ่มดูไอเท็ม และปุ่มออกจากห้อง */
/* หรี่ให้รู้ว่าแตะไม่ได้ แต่ไม่บล็อกคลิกแบบเหมารวมอีกแล้ว
   ตัวที่กันจริงคือ disabled บนปุ่มแต่ละตัว ซึ่งเบราว์เซอร์กันคลิกให้อยู่แล้ว
   การใช้ pointer-events คลุมทั้งกล่องเคยทำให้ปุ่มที่ตั้งใจเปิดไว้กดไม่ได้มาแล้วสองรอบ */
.setup.guestlock .body > *{opacity:.45}
.setup.guestlock .body > #netrow,
.setup.guestlock .body > .actions{opacity:1}
.setup.guestlock .body > .actions #btnStart{opacity:.45}
.setup.guestlock.canrejoin .body > .actions #btnStart{opacity:1}
.guestlock.canrejoin #btnStart{opacity:1}
/* ส่วนที่กดได้โดยไม่มี disabled ต้องกันด้วยวิธีนี้ เพราะ summary ปิดไม่ได้ */
.setup.guestlock .adv{pointer-events:none}
.setup.guestlock.canrejoin .adv{pointer-events:none}
.lockmsg{font-size:12.5px;color:var(--ink-2);margin:10px 0 0}
.lobby{display:grid;gap:6px;margin-top:10px}
.seatrow{display:flex;align-items:center;gap:9px;padding:7px 10px;border:1px solid var(--rule);
  border-radius:4px;background:var(--ctrl-b)}
.seatrow .who{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seatrow .tm{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;padding:1px 6px;
  border-radius:2px;border:1px solid currentColor;white-space:nowrap}
.seatrow .tag2{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--ink-3)}
.seatrow.mine{border-color:var(--brass);background:rgba(216,167,43,.12)}
.seatrow.live{border-color:var(--heal)}
.seatrow .tag2.live{color:var(--heal)}
.seatrow button{padding:5px 12px;font-size:12px}
.netcode{font-family:var(--mono);font-size:22px;letter-spacing:.28em;color:var(--brass);font-weight:600}
.netin{font-family:var(--mono);font-size:16px;letter-spacing:.22em;text-transform:uppercase;
  width:130px;padding:7px 10px;color:var(--ink);background:var(--ctrl);
  border:2px solid var(--rule);border-radius:4px}
.netmsg{font-size:12.5px;color:var(--ink-2)}
.netmsg.bad{color:var(--blood)}
.netmsg.ok{color:var(--heal)}
.ptokwrap{position:relative;flex:none;line-height:0}
.ptokbtn{padding:3px 7px;border:2px solid var(--rule);border-radius:4px;background:var(--ctrl);
  cursor:pointer;line-height:0}
.tokpop{position:absolute;left:0;top:calc(100% + 5px);z-index:20;display:flex;gap:3px;padding:5px;
  background:var(--paper-2);border:1px solid var(--brass);border-radius:5px;
  box-shadow:0 4px 0 var(--shade)}
.tokpop button{padding:3px 5px;border:1px solid transparent;border-radius:3px;background:none;
  cursor:pointer;line-height:0}
.tokpop button[aria-pressed="true"]{border-color:var(--brass);background:rgba(216,167,43,.14)}
.pname{flex:1;min-width:0;font-family:var(--sans);font-size:13px;padding:6px 10px;color:var(--ink);
  background:var(--ctrl);border:2px solid var(--rule);border-radius:4px}
.pname:focus-visible{outline:2px solid var(--hazard);outline-offset:1px}
.seg{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;flex:none}
.seg button{border:0;border-radius:0;padding:6px 12px;font-size:12px;background:var(--ctrl-b);
  color:var(--ink-2);border-left:1px solid var(--rule)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,var(--gold-a),var(--gold-b));color:var(--gold-ink)}
.modal{position:fixed;inset:0;background:var(--veil);display:flex;align-items:center;
  justify-content:center;padding:20px;z-index:30}
.modal .sheet{width:100%;max-width:580px;max-height:82vh;display:flex;flex-direction:column;
  background:var(--paper-2);border:1px solid var(--brass);border-radius:6px;
  box-shadow:0 8px 0 var(--shade)}
.modal .head{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 16px;border-bottom:1px solid var(--rule)}
.modal .head h3{font-family:var(--mono);margin:0;font-size:12px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink-2)}
.modal .list{overflow:auto;padding:6px 0}
.infobody{padding:18px 18px 20px}
#lookBox .opts{margin-bottom:12px}
#lookBox .opts:last-child{margin-bottom:0}
.infobody .nm{margin:0 0 4px;font-size:19px;font-weight:600}
.infobody .kd{margin:0 0 12px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--brass)}
.infobody .ds{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.65}
.irow{display:flex;gap:12px;padding:11px 16px;border-bottom:1px dashed var(--rule)}
.irow:last-child{border-bottom:0}
.irow .no{font-family:var(--mono);font-size:11px;color:var(--ink-3);padding-top:3px;flex:none;width:18px}
.irow .txt{min-width:0}
.irow b{display:block;font-size:14px;margin-bottom:2px}
.irow span{font-size:12.5px;color:var(--ink-2);line-height:1.55}
.irow .kd{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;padding:1px 5px;margin-left:6px;
  border:1px solid var(--rule);border-radius:2px;color:var(--ink-3);white-space:nowrap}
.itemcard{position:absolute;inset:14px;display:flex;align-items:center;justify-content:center;
  background:var(--veil);border-radius:4px;z-index:5}
.itemcard .body{max-width:340px;text-align:center;border:2px solid var(--brass);border-radius:6px;
  background:linear-gradient(180deg,var(--sheet-a),var(--sheet-b));padding:20px 24px;box-shadow:0 6px 0 var(--shade)}
.itemcard h3{font-family:var(--mono);margin:0 0 6px;font-size:12px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--brass)}
.itemcard p.nm{margin:0 0 8px;font-size:20px;font-weight:600}
.itemcard p.ds{margin:0 0 18px;font-size:13.5px;color:var(--ink-2);line-height:1.55}
.itemcard .actions{justify-content:center;margin:0}
.statebadge{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;padding:1px 6px;margin-left:2px;
  border:1px solid currentColor;border-radius:2px;white-space:nowrap;cursor:help}
.statebadge.ban{color:var(--blood)}
.statebadge.slow{color:var(--slow-col)}
.statebadge.lift{color:var(--lift-col)}
.status .why.warn{color:var(--blood)}
.itembadge{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;padding:2px 6px;margin-left:2px;
  border:1px solid var(--brass);border-radius:2px;color:var(--brass);white-space:nowrap;
  background:none;cursor:pointer}
.itembadge:hover{background:rgba(216,167,43,.16)}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;padding:1px 5px;margin-left:2px;
  border:1px solid var(--rule);border-radius:2px;color:var(--ink-3)}
.rules{font-size:13px;color:var(--ink-2);border-top:1px dashed var(--rule);padding-top:14px}
.rules b{font-weight:600;color:var(--ink)}
.rules div{margin-bottom:5px}

.game{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
@media(max-width:880px){.game{grid-template-columns:1fr}}

/* ---------- จอมือถือ ----------
   หลักคิด: กระดานต้องได้พื้นที่มากที่สุด ปุ่มต้องกดด้วยนิ้วได้ และไม่มีอะไรล้นขอบจอ
   ทุกอย่างเรียงเป็นแถวเดียวจากบนลงล่าง ตามลำดับที่ต้องใช้จริงระหว่างเล่น */
@media(max-width:640px){
  body{padding:12px 10px 32px}
  h1{font-size:19px;letter-spacing:.16em}
  .tagline{font-size:12.5px}
  .meta{font-size:10px}
  header{padding-bottom:8px;margin-bottom:14px}
  .top{gap:10px}
  .tools{justify-content:flex-start;width:100%}

  .setup{margin:4px auto}
  .setup .body{padding:14px}
  .setup p{font-size:14px;margin-bottom:12px}
  .card h2{padding:8px 12px}

  /* ปุ่มจำนวนผู้เล่นเรียงเต็มแถว นิ้วกดง่าย */
  .choices{gap:6px}
  .choice{padding:14px 2px;font-size:18px}

  /* แถวตั้งค่าที่มีป้ายกับตัวเลือก ให้ป้ายขึ้นบรรทัดของตัวเอง ไม่งั้นบีบจนอ่านไม่ออก */
  .opt{flex-wrap:wrap;gap:8px;padding:9px 10px}
  .opt > span:first-child{flex:1 0 100%}
  .seg{flex-wrap:wrap}
  .seg button{padding:9px 12px}
  .pick,.netin{flex:1;min-width:0}

  /* แถวผู้เล่น ชื่อกินพื้นที่ที่เหลือ ปุ่มคนกับคอมไปอยู่บรรทัดล่างเมื่อที่ไม่พอ */
  .prow{flex-wrap:wrap;gap:8px}
  .pname{flex:1 1 120px;font-size:16px}
  .ptokbtn{padding:5px 9px}

  /* พื้นที่กระดาน ตัดขอบในให้เหลือน้อยที่สุดเพื่อให้ช่องใหญ่ที่สุดเท่าที่ทำได้ */
  .game{gap:12px}
  .stage{padding:8px}
  svg#board{max-width:100%}
  .console{padding:12px 10px}
  .readout{gap:10px}
  .die{width:42px;height:42px}

  /* ปุ่มสั่งการต้องสูงพอสำหรับนิ้ว */
  button{padding:11px 16px;font-size:15px}
  .actions{gap:10px}
  .actions button{flex:1 1 auto;min-height:46px}
  .steps{gap:8px}
  .stepbtn{min-width:52px;min-height:50px;font-size:17px;padding:9px 12px}
  .stepbtn{padding-bottom:17px}

  /* แผงหน่วยกับบันทึกอยู่ใต้กระดาน ย่อความสูงลงไม่ให้ต้องเลื่อนยาว */
  .log{max-height:180px}
  .unit{padding:7px 10px}
  .modal{padding:10px}
  .modal .sheet{max-height:88vh}
  .infobody{padding:14px}
  .irow{padding:10px 12px}

  /* หน้าต่างยืนยันไอเท็มเต็มจอมากขึ้น */
  .itemcard{inset:8px}
  .itemcard .body{padding:16px 18px}

  /* แถบเลือกรูปทรงตัวละครมีหกตัว บนจอแคบต้องพับบรรทัดไม่ให้ล้นออกนอกจอ */
  .tokpop{max-width:calc(100vw - 40px);flex-wrap:wrap;left:auto;right:0}
}

/* จอแคบมาก เช่นมือถือรุ่นเล็กหรือแนวนอนแคบ */
@media(max-width:380px){
  h1{font-size:17px}
  .choice{font-size:16px;padding:12px 2px}
  .stepbtn{min-width:46px;font-size:16px}
  .netcode{font-size:18px;letter-spacing:.2em}
}

.stage{position:relative;padding:14px;display:flex;justify-content:center;
  background:var(--stage);
  background-image:var(--stage),
    repeating-linear-gradient(88deg,var(--stage-line) 0 1px,transparent 1px 19px);
  border-bottom:1px solid var(--rule)}
svg#board{width:100%;height:auto;max-width:560px;display:block}
.tile{fill:var(--tile);stroke:var(--tile-line);stroke-width:1}
.tile.start{stroke-width:2.5}
.tile.cache{fill:var(--cache);stroke:var(--brass);stroke-dasharray:3 2.5}
.basebox{fill:none;stroke-width:1.6;stroke-dasharray:3.5 2.5;opacity:.9}
.cglyph{font-family:var(--mono);font-weight:600;fill:var(--brass);text-anchor:middle;dominant-baseline:central}
.tnum{font-family:var(--mono);fill:var(--ink-3);text-anchor:middle;dominant-baseline:central}
.slabel{font-family:var(--mono);font-size:10px;letter-spacing:.04em;dominant-baseline:central}
.guide{fill:none;stroke:var(--tile-line);stroke-width:1;stroke-dasharray:2 6;opacity:.5}
.platform{fill:var(--plank);stroke:var(--tile-line);stroke-width:1;opacity:.85}
.tie line{stroke:var(--tie);stroke-width:2.4;opacity:.75}
.rail{fill:none;stroke:var(--rail);stroke-width:1.8;opacity:.85}
.sheen{fill:#fff;opacity:.32;pointer-events:none}
.pin{stroke:var(--outline);stroke-width:1.8;stroke-linejoin:round}
.pinshadow{fill:var(--outline);opacity:.35}
.pinteam{stroke:var(--outline);stroke-width:0.8}
.tokline{stroke:var(--outline)}
.tokpole{stroke-linecap:round}
/* ตัวที่ถึงเทิร์นกระพริบ อ่านออกทันทีแม้มองผ่าน ๆ และไม่ขยับตำแหน่งจึงไม่รบกวนการนับช่อง */
@keyframes tokblink{0%,100%{opacity:1}50%{opacity:.32}}
.blink{animation:tokblink 1s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.blink{animation:none}}
.pinletter{font-family:var(--mono);font-weight:600;fill:var(--outline);text-anchor:middle;dominant-baseline:central}
.pinring{fill:none;stroke-width:2.6;opacity:.9;animation:pickpulse 1.4s ease-in-out infinite}
.shadow{fill:var(--ink);opacity:.16}
.tletter{font-family:var(--mono);font-size:11px;font-weight:600;fill:var(--outline);text-anchor:middle;dominant-baseline:central}
.mine{stroke:var(--brass);stroke-width:1.8}
.mlabel{font-family:var(--mono);font-weight:600;fill:var(--outline);text-anchor:middle;dominant-baseline:central}
.blast{animation:blast .7s ease-out}
@keyframes blast{0%{fill:var(--blood)}60%{fill:var(--hazard)}100%{fill:var(--paper)}}
@media(prefers-reduced-motion:reduce){.blast{animation:none}}

.console{padding:14px;border-top:1px solid var(--rule);margin-top:10px}
.readout{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.die{width:48px;height:48px;flex:none;background:linear-gradient(160deg,var(--die1),var(--die2));border:1.5px solid var(--outline);border-radius:8px;box-shadow:0 2px 0 var(--shade);
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:7px;gap:2px}
.die i{border-radius:50%;background:transparent}
.die i.on{background:var(--outline)}
.dice{display:flex;gap:8px;flex:none}
.hudslot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
.hud{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}
/* แบบรถไฟกลางกระดานมีช่องอยู่ ลูกเต๋าจึงย้ายลงมาอยู่แถวเดียวกับสถานะแทน */
.hud.bar{flex-direction:row;align-items:center;gap:12px;text-align:left}
.hud.bar .hudname{max-width:170px}
.hudname{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--ink-2);
  max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hudhp{font-size:14px}
.floater{font-family:var(--mono);font-weight:600;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.die{transition:box-shadow .2s}
.die.rolling{animation:tumble .3s linear infinite}
@keyframes tumble{
  0%{transform:rotate(0) scale(1) translateY(0)}
  25%{transform:rotate(-15deg) scale(1.07) translateY(-4px)}
  50%{transform:rotate(7deg) scale(.95) translateY(3px)}
  75%{transform:rotate(16deg) scale(1.05) translateY(-2px)}
  100%{transform:rotate(0) scale(1) translateY(0)}
}
.die.settle{animation:settle .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes settle{0%{transform:scale(1.24)}55%{transform:scale(.95)}100%{transform:scale(1)}}
.stage.shake{animation:bshake .42s ease-out}
@keyframes bshake{
  0%,100%{transform:translate(0,0)}
  15%{transform:translate(-5px,2px)}35%{transform:translate(4px,-3px)}
  55%{transform:translate(-3px,-1px)}75%{transform:translate(2px,2px)}
}
@media(prefers-reduced-motion:reduce){
  .die.rolling,.die.settle,.stage.shake{animation:none}
}
.status{flex:1;min-width:200px;font-size:14px}
.status b{font-weight:600}
.status .why{display:block;font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.stepbtn{font-family:var(--mono);font-size:16px;font-weight:600;padding:7px 14px;min-width:42px}
#btnReset{margin-left:auto;font-size:13px;padding:7px 14px;border-color:var(--rule);color:var(--ink-2)}
#btnReset:hover{border-color:var(--ink);color:var(--ink)}
.stepbtn{position:relative}
.stepbtn.danger{border-color:var(--blood);color:var(--blood);border-width:2px}
.stepbtn.danger2{background:var(--blood);color:var(--paper-2);border-color:var(--blood)}
/* ขอบเป็นช่องบอกอันตราย ส่วนเส้นประด้านในเป็นช่องบอกว่าช่องนั้นคืออะไร แยกกันคนละชั้น */
.stepbtn.depot{outline:2px dotted var(--brass);outline-offset:-5px}
/* ฐานใช้ไอคอนบ้านแทนเส้นประ เพราะเส้นประไปสับสนกับขอบเตือนทุ่นระเบิด
   บ้านทึบคือฐานเรา บ้านโปร่งคือฐานคนอื่น สีตามเจ้าของฐาน */
.stepbtn{padding-bottom:15px}
.basemark{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);line-height:0}
.stepbtn.own::after{content:'';position:absolute;right:4px;top:4px;width:5px;height:5px;
  border-radius:50%;background:var(--homecol)}
.pick{fill:none;stroke-width:2.5;animation:pickpulse 1.4s ease-in-out infinite}
@keyframes pickpulse{0%,100%{opacity:1}50%{opacity:.4}}
.badge{stroke:var(--paper-2);stroke-width:1.5}
.btxt{font-family:var(--mono);font-size:11px;font-weight:600;fill:var(--paper-2);text-anchor:middle;dominant-baseline:central}
.hit{cursor:pointer}
@media(prefers-reduced-motion:reduce){.pick{animation:none}}
button{font-family:var(--sans);font-size:14px;font-weight:500;padding:9px 18px;border-radius:4px;cursor:pointer;
  border:1px solid var(--rule);color:var(--ink);
  background:linear-gradient(180deg,var(--ctrl-a),var(--ctrl-b));
  box-shadow:inset 0 1px 0 var(--emboss)}
button:hover{border-color:var(--brass)}
button.primary{background:linear-gradient(180deg,var(--gold-a),var(--gold-b));border-color:var(--brass-dark);color:var(--gold-ink)}
button.hazard{background:linear-gradient(180deg,var(--gold-a),var(--gold-b));border-color:var(--brass-dark);color:var(--gold-ink)}
button:disabled{opacity:.34;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--hazard);outline-offset:2px}

.units{padding:6px 0}
.unit{display:flex;align-items:center;gap:9px;padding:9px 14px;border-bottom:1px dashed var(--rule)}
.unit:last-child{border-bottom:0}
.unit.turn{background:rgba(216,167,43,.12)}
.teamhead{display:flex;align-items:center;gap:8px;margin:10px 0 4px;font-family:var(--mono);
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.teamhead:first-child{margin-top:0}
.teamhead .bar{flex:1;height:1px;background:var(--rule)}
.teamhead .dot{width:9px;height:9px;border-radius:2px;flex:none}
.chipwrap{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none;width:28px}
.uicon{line-height:0}
.botmark{line-height:0;color:var(--ink-3);cursor:help}
.botmark svg{display:block}
.chip{width:19px;height:19px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.45);
  box-shadow:inset 0 1.5px 0 var(--emboss);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10px;font-weight:600;color:var(--paper-2)}
.uname{font-size:13px;font-weight:500;flex:1;min-width:0}
.uname em{font-family:var(--mono);font-style:normal;font-size:10px;color:var(--ink-3);letter-spacing:.06em;display:block}
.pips{font-family:var(--mono);font-size:13px;letter-spacing:1px;white-space:nowrap}
.pips i{font-style:normal}
.pips i.off{opacity:.22}
.pips.hp{color:var(--blood);font-size:12px;letter-spacing:.5px}
.pips.mn{color:var(--ink-2);font-size:12px;display:inline-flex;align-items:center;gap:1px}
.mglyph{vertical-align:-2px}
.mglyph.off{opacity:.22}
.mx{font-family:var(--mono);font-size:12px;margin-left:2px}
.nm{display:flex;align-items:center;gap:7px}
.unit.out{opacity:.45}
.unit.out .uname{text-decoration:line-through}

.log{list-style:none;margin:0;padding:6px 0;max-height:280px;overflow-y:auto}
.log li{font-size:12.5px;padding:5px 14px;border-bottom:1px dashed var(--rule);display:flex;gap:9px}
.log li:last-child{border-bottom:0}
.log .t{font-family:var(--mono);font-size:10px;color:var(--ink-3);flex:none;padding-top:2px}
.log .k-boom{background:rgba(217,80,63,.14);color:var(--blood);font-weight:500}
.log .k-heal{color:var(--heal)}
.log .k-mine{color:var(--brass)}
.log .k-out{background:var(--shade);font-weight:600}
.log .k-win{background:linear-gradient(180deg,var(--gold-a),var(--gold-b));color:var(--gold-ink);font-weight:600}
.log .k-restock{color:var(--brass);font-weight:500}

.over{position:absolute;inset:14px;display:flex;align-items:center;justify-content:center;
  background:var(--veil);border-radius:4px}
.over div{text-align:center;border:2px solid var(--brass);background:linear-gradient(180deg,var(--sheet-a),var(--sheet-b));
  padding:22px 30px;border-radius:6px;transform:rotate(-2deg);box-shadow:0 6px 0 var(--shade)}
.over h3{font-family:var(--mono);margin:0 0 4px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2)}
.over p{margin:0 0 16px;font-size:21px;font-weight:600}
.hidden{display:none !important}
footer{margin-top:20px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <div>
        <div class="brand">
          <h1>Minefield</h1>
          <span class="tagline" id="tagline"></span>
        </div>
        <div class="meta" id="meta"></div>
        <div class="ver" id="ver"></div>
      </div>
      <div class="tools">
        <div class="langs"><button id="btnLook" type="button"></button></div>
        <div class="langs"><button id="btnSound" type="button"></button></div>
        <div class="langs" id="langs"></div>
      </div>
    </div>
  </header>

  <section class="card setup" id="setup">
    <h2 id="setupTitle"></h2>
    <div class="body">
      <p id="setupIntro"></p>
      <div class="fieldlbl" id="lblPlayers"></div>
      <div class="choices" id="choices"></div>
      <div class="proster" id="proster"></div>
      <div class="opts" id="netrow"></div>
      <div class="opts" id="teamrow"></div>
      <div class="opts" id="shaperow"></div>
      <details class="adv"><summary id="advTitle"></summary>
        <div class="advbody">
          <div class="opts" id="botrow"></div>
          <div class="opts" id="opts"></div>
        </div>
      </details>
      <div class="rules" id="rules"></div>
      <div class="actions">
        <button class="primary" id="btnStart"></button>
        <button id="btnItems"></button>
      </div>
    </div>
  </section>

  <section class="game hidden" id="game">
    <div class="card">
      <h2 id="boardTitle"></h2>
      <div class="stage">
        <svg id="board" role="img"></svg>
        <div class="hudslot" id="hudBoard">
          <div class="hud" id="hud" aria-hidden="true">
            <div class="dice"><div class="die" id="dieA"></div><div class="die" id="dieB"></div></div>
            <div class="hudname" id="hudName"></div>
            <div class="hudhp pips hp" id="hudHp"></div>
          </div>
        </div>
        <div class="itemcard hidden" id="itemCard">
          <div class="body">
            <h3 id="itemKicker"></h3>
            <p class="nm" id="itemName"></p>
            <p class="ds" id="itemDesc"></p>
            <div class="actions">
              <button id="btnItemNo"></button>
              <button class="hazard" id="btnItemYes"></button>
            </div>
          </div>
        </div>
        <div class="over hidden" id="over">
          <div>
            <h3 id="overKicker"></h3>
            <p id="overText"></p>
            <button class="primary" id="btnAgain"></button>
          </div>
        </div>
      </div>
      <div class="console">
        <div class="readout">
          <div id="hudBar"></div>
          <div class="status" id="status" aria-live="polite"></div>
        </div>
        <div class="actions">
          <button id="btnUseItem"></button>
          <button class="primary" id="btnRoll"></button>
          <div class="steps" id="steps"></div>
          <button class="hazard hidden" id="btnPlace"></button>
          <button class="hidden" id="btnSkip"></button>
          <button id="btnReset"></button>
        </div>
      </div>
    </div>

    <div>
      <div class="card" style="margin-bottom:18px">

  <div class="modal hidden" id="lookBox">
    <div class="sheet">

        <h3 id="lookKicker"></h3>

      </div>
      <div class="infobody">
        <div class="opts" id="themerow"></div>
        <div class="opts" id="viewrow"></div>
      </div>
    </div>
  </div>

  <div class="modal hidden" id="itemInfo">
    <div class="sheet">
      <div class="head">
        <h3 id="infoKicker"></h3>
        <button id="btnInfoClose"></button>
      </div>
      <div class="infobody">
        <p class="nm" id="infoName"></p>
        <p class="kd" id="infoKind"></p>
        <p class="ds" id="infoDesc"></p>
      </div>

  <div class="modal hidden" id="itemList">
    <div class="sheet">
      <div class="head">
        <h3 id="itemsTitle"></h3>
        <button id="btnItemsClose"></button>
      </div>
      <div class="list" id="itemsBody"></div>
    </div>
  </div>

  <footer id="footer"></footer>
</div>

<script>
/* สนามทุ่นระเบิด - รูปทรงบอร์ด
   ทุกรูปทรงถูกแทนด้วยแนวคิดเดียวกัน: เส้นทางปิดหนึ่งเส้น แล้ววางช่องตามระยะทางบนเส้นให้เท่ากัน
   คณิตศาสตร์ล้วน ไม่แตะ DOM และไม่ใช้ getPointAtLength ของเบราว์เซอร์ จึงเทสต์ใน node ได้ */
(function (root) {
  'use strict';

  var TAU = Math.PI * 2;
  var ROW_GAP = 4.2;    /* ระยะห่างแถวขั้นต่ำ คิดเป็นกี่เท่าของรัศมีช่อง */
  var MIN_CLEAR = 2.4;  /* ช่องที่ไม่ได้ติดกันตามลำดับต้องห่างกันอย่างน้อยกี่เท่าของรัศมี */

  /* ---------- เส้นทางประกอบจากท่อนตรงและท่อนโค้ง ---------- */

  function line(ax, ay, bx, by) {
    return { t: 'line', ax: ax, ay: ay, bx: bx, by: by,
             len: Math.hypot(bx - ax, by - ay) };
  }
  function arc(cx, cy, r, a0, a1) {
    return { t: 'arc', cx: cx, cy: cy, r: r, a0: a0, a1: a1,
             len: r * Math.abs(a1 - a0) };
  }
  function total(segs) {
    return segs.reduce(function (s, x) { return s + x.len; }, 0);
  }

  /* คืนพิกัดและเวกเตอร์ทิศทางที่ระยะทาง t บนเส้นทาง */
  function pointAt(segs, P, t) {

    { letter: 'C', color: '#8A2866' },
    { letter: 'D', color: '#166966' },
    { letter: 'E', color: '#471535' },
    { letter: 'F', color: '#104C4A' }
  ];

  var UNITS = [
    { letter: 'A', color: '#DE55B4' },
    { letter: 'B', color: '#4F9FE0' },
    { letter: 'C', color: '#8FC24C' },
    { letter: 'D', color: '#B586E2' },
    { letter: 'E', color: '#D6DEE4' },
    { letter: 'F', color: '#3FC7BC' }
  ];

  var ERR = {
    NO_MINE: 'ERR_NO_MINE', MINED: 'ERR_MINED', STACK_FULL: 'ERR_STACK_FULL',
    BANNED: 'ERR_BANNED'
  };

  /* ไอเท็มแบ่งเป็นสองชนิดตามกลไก
     now  = เกิดผลทันทีตอนกดใช้ แล้วกลับมาทอยเต๋าตามปกติ
     turn = ยังไม่เห็นผล ต้องทอยเต๋าก่อนถึงจะทำงาน มีอายุแค่เทิร์นนี้ */
  var ITEMS = [
    { key: 'sweep',     kind: 'turn' },   /* ล้างทุ่นบนช่องที่ตรงกับสองแต้มที่ทอยได้ */
    { key: 'sweep3',    kind: 'now'  },   /* ล้างทุ่นบนช่อง +1 +2 +3 ข้างหน้าทันที */
    { key: 'min1',      kind: 'turn' },   /* ช่วงเริ่มที่ 1 เสมอ */
    { key: 'max6',      kind: 'turn' },   /* ช่วงจบที่ 6 เสมอ */
    { key: 'plus1',     kind: 'now'  },   /* ยกพื้นคู่แข่ง บวก 1 ที่แต้มน้อยที่สุด คนละ 2 เทิร์น */
    { key: 'plus2',     kind: 'turn' },   /* บวก 2 เฉพาะแต้มที่มากกว่า */
    { key: 'ghost',     kind: 'turn' },   /* หยุดบนทุ่นคนอื่นได้โดยไม่ระเบิด */
    { key: 'reverse',   kind: 'turn' },   /* เดินย้อนทิศ */
    { key: 'fast',      kind: 'turn' },   /* แต้มคูณสองทั้งสองลูก */
    { key: 'slow',      kind: 'now'  },   /* ผู้เล่นทุกคนโดนชะลอคนละ 1 เทิร์น */
    { key: 'again',     kind: 'turn' },   /* จบเทิร์นแล้วได้ทอยอีกครั้ง */
    { key: 'double',    kind: 'turn' },   /* วางทุ่นได้ 2 ลูกในเทิร์นเดียว ลงช่องเดียวกัน */
    { key: 'recall',    kind: 'now'  },   /* ย้ายกลับฐานตัวเองแล้วจบเทิร์น */
    { key: 'giveAll',   kind: 'now' },    /* ทุกคนได้ทุ่น +1 */
    { key: 'takeAll',   kind: 'now' },    /* ทุกคนเสียทุ่น -1 */
    { key: 'give2',     kind: 'now' },    /* ผู้ใช้ได้ทุ่น +2 */
    { key: 'wipeItems', kind: 'now' },    /* คนอื่นทิ้งไอเท็มที่ถืออยู่ */
    { key: 'clearBase', kind: 'now' },    /* ล้างทุ่นศัตรูบนฐานผู้ใช้ */
    { key: 'banPlace',  kind: 'now' },    /* ห้ามคู่แข่งวางทุ่น 2 รอบวง */
    { key: 'skipTurn',  kind: 'now' }     /* ผู้ใช้ข้ามเทิร์นนี้ */
  ];
  var ITEM_BY_KEY = {};
  ITEMS.forEach(function (it) { ITEM_BY_KEY[it.key] = it; });
  function itemKind(key) { return ITEM_BY_KEY[key] ? ITEM_BY_KEY[key].kind : null; }
  /* กองไอเท็มถูกสับไว้ตั้งแต่ต้นเกม ผู้เล่นได้รับตามลำดับที่สับไว้ ใช้แล้วต่อท้ายกอง
     ผลคือไอเท็มชนิดเดียวกันจะไม่มีทางอยู่ในมือสองคนพร้อมกัน และวนครบทุกชนิดก่อนซ้ำ */
  function shuffled(rng) {
    var d = ITEMS.map(function (i) { return i.key; });
    for (var i = d.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var t = d[i]; d[i] = d[j]; d[j] = t;
    }
    return d;
  }
  function drawItem(s, rng) {
    if (!s.deck.length) s.deck = shuffled(rng || Math.random);   /* กันไว้ ปกติไม่มีทางหมด */
    return s.deck.shift();
  }
  function returnItem(s, key) { if (key) s.deck.push(key); }

  function clone(s) { return JSON.parse(JSON.stringify(s)); }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function isAlive(p) { return p.hp > 0; }

  /* หัวใจของโหมดทีม ทุกที่ที่เคยเทียบ id กันตรง ๆ ต้องเปลี่ยนมาเรียกตัวนี้แทน
     โหมดเดี่ยวยังทำงานเหมือนเดิมเพราะแต่ละคนถูกตั้งให้เป็นทีมของตัวเอง */
  function sameTeam(s, a, b) {
    if (a === b) return true;
    var pa = s.players[a], pb = s.players[b];
    return !!pa && !!pb && pa.team === pb.team;
  }
  function teamOf(s, id) { return s.players[id].team; }
  function teammates(s, id) {
    return alivePlayers(s).filter(function (o) { return sameTeam(s, o.id, id); });
  }
  function foes(s, id) {
    return alivePlayers(s).filter(function (o) { return !sameTeam(s, o.id, id); });
  }
  function alivePlayers(s) { return s.players.filter(isAlive); }

  function log(s, kind, key, params) {
    s.log.unshift({ turn: s.turnCount + 1, kind: kind, key: key, p: params || {} });
    return s;
  }

  function maxCaches(spacing) { return Math.floor(spacing / C.CACHE_DIV); }

  function pickOffsets(spacing, k, rng) {
    var pool = [], i, j, t;
    for (i = 1; i < spacing; i++) pool.push(i);
    for (j = pool.length - 1; j > 0; j--) {
      i = Math.floor(rng() * (j + 1));
      t = pool[j]; pool[j] = pool[i]; pool[i] = t;
    }
    return pool.slice(0, k).sort(function (a, b) { return a - b; });
  }

  function buildCaches(count, spacing, k, rng) {
    var out = {};
    for (var seg = 0; seg < count; seg++) {
      pickOffsets(spacing, k, rng).forEach(function (off) {
        out[seg * spacing + off] = true;
      });
    }
    return out;
  }

  function cleanName(v) {
    if (typeof v !== 'string') return null;
    var t = v.trim().slice(0, 14);
    return t.length ? t : null;
  }

  function createGame(n, opts) {
    opts = opts || {};
    var count = clamp(n | 0, 2, C.MAX_PLAYERS);
    var spacing = clamp(opts.spacing === undefined ? C.SPACING : opts.spacing | 0, C.SPACING_MIN, C.SPACING_MAX);
    var cacheCount = clamp(opts.caches === undefined ? C.CACHES : opts.caches | 0, 0, maxCaches(spacing));
    var mineMax = clamp(opts.mineMax === undefined ? C.MINE_MAX : opts.mineMax | 0, 1, C.MINE_HARD_MAX);
    var mineStart = clamp(opts.mineStart === undefined ? C.MINE_START : opts.mineStart | 0, 0, mineMax);
    /* เพดานหัวใจผูกกับค่าเริ่มต้นเสมอ คือมากกว่าหนึ่งดวง เพื่อให้การกลับฐานยังมีที่ให้ฟื้นเสมอ */
    var hpStart = clamp(opts.hpStart === undefined ? C.HP_START : opts.hpStart | 0, 1, C.HP_HARD_MAX);
    var hpMax = hpStart + 1;
    var rng = opts.rng || Math.random;
    /* รูปทรงบอร์ดไม่กระทบกติกาเลย แต่เก็บไว้ใน state เพื่อให้ replay หรือ save ได้ในอนาคต */
    var shape = ({ ring: 1, poly: 1, snake: 1 })[opts.shape] ? opts.shape : 'ring';
    if (shape === 'poly' && count < 3) shape = 'ring';
    /* บอร์ดแบบรถไฟสุ่มพลิกซ้ายขวาและบนล่างทุกเกม ได้ผัง 4 แบบจากรูปทรงเดียว
       เก็บผลสุ่มไว้ใน state ไม่ใช่สุ่มตอนวาด ไม่งั้นสลับภาษาแล้วผังจะเปลี่ยนกลางเกม */
    /* ผังแบบรถไฟถูกสุ่มพลิกซ้ายขวาและบนล่าง ใส่ทั้งคู่ได้ผลเหมือนหมุน 180 องศา
       เก็บไว้ใน rules เพื่อให้วาดซ้ำได้เหมือนเดิมตอนสลับภาษาหรือรีเรนเดอร์ */
    var flip = { x: false, y: false, sym: false };
    if (shape === 'snake') {
      /* หนึ่งในสามของเกมได้ผังสมมาตรที่ไม่มีโค้งใหญ่เป็นทางกลับ
         ที่เหลือได้ผังหวีเดี่ยวซึ่งสุ่มพลิกซ้ายขวาและบนล่างอีกชั้น */
      flip.sym = rng() < 0.34;
      flip.x = rng() < 0.5;
      flip.y = rng() < 0.5;
    }
    /* โหมดทีมรองรับเฉพาะ 4 หรือ 6 คน เพราะต้องแบ่ง 2-2 หรือ 3-3 ลงตัว */
    var teams = !!opts.teams && (count === 4 || count === 6);
    var units = teams ? TEAM_UNITS : UNITS;
    var names = opts.names || [];
    var bots = opts.bots || [];
    var boardSize = count * spacing;

    var startTiles = [], players = [];
    for (var i = 0; i < count; i++) {
      var tile = i * spacing;
      startTiles.push(tile);
      players.push({
        id: i,
        letter: units[i].letter,
        color: units[i].color,
        team: teams ? (i % 2) : i,       /* ไม่เล่นทีมก็ถือว่าแต่ละคนเป็นทีมของตัวเอง */
        name: cleanName(names[i]),
        bot: bots[i] || null,
        startTile: tile,
        pos: tile,
        mines: mineStart,
        hp: hpStart,
        item: null,
        slow: 0,          /* จำนวนเทิร์นที่ยังโดนชะลออยู่ */
        lift: 0        /* จำนวนเทิร์นที่ยังโดนยกพื้นอยู่ */
      });
    }

    return {
      phase: 'AWAIT_ROLL',
      forced: false,
      boardSize: boardSize,
      rules: {
        mineStart: mineStart, mineMax: mineMax, spacing: spacing, caches: cacheCount,
        hpStart: hpStart, hpMax: hpMax, shape: shape, flip: flip, teams: teams
      },
      startTiles: startTiles,
      caches: buildCaches(count, spacing, cacheCount, rng),
      players: players,
      currentIdx: 0,
      mines: {},
      deck: shuffled(rng),
      winnerTeam: null,
      lastRoll: null,
      lastRaw: null,
      turnMod: null,        /* ผลของไอเท็มที่ติดตัวเฉพาะเทิร์นนี้ */
      ban: null,            /* { untilId, rounds } ห้ามคู่แข่งวางทุ่น นับถอยหลังทุกครั้งที่วนกลับถึงเจ้าของ */
      turnCount: 0,
      winner: null,
      log: [{ turn: 1, kind: 'info', key: 'open', p: { n: count, tiles: boardSize, caches: cacheCount * count } }]
    };
  }

  /* คืนคู่แต้ม ไม่ใช่ผลบวก */
  function rollDice(rng) {
    var r = rng || Math.random;
    return { a: 1 + Math.floor(r() * 6), b: 1 + Math.floor(r() * 6) };
  }

  function isDouble(roll) { return !!roll && roll.a === roll.b; }

  /* ช่วงจำนวนก้าวที่เลือกได้ แต้มซ้ำจะเหลือค่าเดียว */
  function stepRange(roll) {
    if (!roll) return null;
    return [Math.min(roll.a, roll.b), Math.max(roll.a, roll.b)];
  }

  function stepChoices(roll) {
    var r = stepRange(roll);
    if (!r) return [];
    var out = [];
    for (var i = r[0]; i <= r[1]; i++) out.push(i);
    return out;
  }

  /* ตัวเลือกปลายทางทั้งหมดของเทิร์นนี้ ใช้ทั้งฝั่ง UI และฝั่งบอท */
  function direction(s) { return (s.turnMod && s.turnMod.kind === 'reverse') ? -1 : 1; }

  function destOf(s, steps) {
    var p = s.players[s.currentIdx];
    var n = s.boardSize;
    return ((p.pos + steps * direction(s)) % n + n) % n;
  }

  function moveOptions(s) {
    return stepChoices(s.lastRoll).map(function (n) {
      return { steps: n, tile: destOf(s, n) };
    });
  }

  /* ไอเท็มความเร็วปรับที่ละลูก ไม่ใช่คูณแต้มเข้าด้วยกัน ช่วงให้เลือกจึงยังอยู่ครบ
     ทอยได้ 2 กับ 4 เดินไวขึ้นได้ช่วง 4 ถึง 8 เดินช้าลงได้ช่วง 1 ถึง 2 */
  function scaleRoll(roll, mod) {
    if (!mod) return { a: roll.a, b: roll.b };
    /* แต้มซ้ำคูณแค่ลูกเดียว ช่วงจึงเปิดจากแต้มเดิมถึงสองเท่า แทนที่จะเหลือค่าเดียวเหมือนเดิม */
    if (mod.kind === 'fast') {
      return roll.a === roll.b ? { a: roll.a, b: roll.b * 2 }
                               : { a: roll.a * 2, b: roll.b * 2 };
    }
    /* สองตัวนี้ขยายช่วงอย่างเดียว ไม่เคยหด ตัวเลือกเดิมจึงยังอยู่ครบ
       และมีผลข้างเคียงที่ดีคือคืนสิทธิ์เลือกให้กับการทอยแต้มซ้ำด้วย */
    if (mod.kind === 'min1') return { a: 1, b: Math.max(roll.a, roll.b) };
    if (mod.kind === 'max6') return { a: Math.min(roll.a, roll.b), b: 6 };
    /* บวกเฉพาะแต้มที่มากกว่า ช่วงจึงขยายขึ้นข้างบนแทนการเลื่อนทั้งก้อน
       ตัวเลือกช่องใกล้ที่เคยมีจึงไม่หายไป ซึ่งเป็นคุณสมบัติที่พิสูจน์แล้วว่าได้ผล */
    if (mod.kind === 'plus2') return { a: Math.min(roll.a, roll.b), b: Math.max(roll.a, roll.b) + 2 };
    return { a: roll.a, b: roll.b };
  }

  /* บันทึกผลทอยแล้วเข้าสู่ช่วงเลือกก้าว */
  function applyRoll(s, roll, rng) {
    s = clone(s);
    var p = s.players[s.currentIdx];
    var r = rng || Math.random;

    s.lastRaw = { a: roll.a, b: roll.b };
    var eff = scaleRoll(roll, s.turnMod);
    /* ยกพื้น: บวก 1 ที่แต้มน้อยที่สุด แต้มมากที่สุดเท่าเดิม ช่วงเดินจึงแคบลงจากด้านล่าง
       ถ้าทอยได้แต้มซ้ำจะบวกทั้งสองลูก */
    if (p.lift > 0) {
      eff = (eff.a === eff.b)
        ? { a: eff.a + 1, b: eff.b + 1 }
        : { a: Math.min(eff.a, eff.b) + 1, b: Math.max(eff.a, eff.b) };
      p.lift -= 1;
      log(s, 'safe', 'lifted', { p: p.id, left: p.lift });
    }
    /* ธงชะลอถูกตั้งโดยไอเท็มของใครก็ได้ ใช้ได้ครั้งเดียวแล้วหมดไป */
    if (p.slow > 0) {
      eff = { a: Math.ceil(eff.a / 2), b: Math.ceil(eff.b / 2) };
      p.slow -= 1;
      log(s, 'safe', 'slowed', { p: p.id });
    }
    s.lastRoll = eff;

    /* แต้มซ้ำได้ไอเท็ม ถ้ามือมีของอยู่แล้วจะถูกแทนที่ และถูกบังคับวางทุ่นด้วย
       ข้อหลังคือสิ่งที่รักษาแรงกดดันให้ทุ่นไหลลงบอร์ดหลังถอดกฎบังคับวางแบบเดิมออก */
    s.forced = false;
    if (isDouble(roll)) {
      var had = p.item;
      p.item = drawItem(s, r);
      returnItem(s, had);                       /* ของเก่าลงท้ายกอง ไม่หายไปจากระบบ */
      log(s, 'mine', had ? 'itemSwap' : 'itemGet',
        { p: p.id, item: p.item, old: had || '', left: s.deck.length });
      if (had) s.forced = true;
    }

    /* ล้างทุ่นบนช่องที่ตรงกับสองแต้มที่ทอยได้ นับจากตำแหน่งปัจจุบัน ล้างของตัวเองด้วย */
    if (s.turnMod && s.turnMod.kind === 'sweep') {
      var dirS = 1, hit = [];
      [s.lastRoll.a, s.lastRoll.b].forEach(function (n) {
        var t = ((p.pos + n * dirS) % s.boardSize + s.boardSize) % s.boardSize;
        if (s.mines[t] && hit.indexOf(t) < 0) { delete s.mines[t]; hit.push(t); }
      });
      log(s, 'mine', 'sweep', { p: p.id, a: s.lastRoll.a, b: s.lastRoll.b, n: hit.length });
    }

    s.phase = 'AWAIT_MOVE';
    return s;
  }

  function pathFor(s, steps) {
    var p = s.players[s.currentIdx];
    var out = [], n = s.boardSize, d = direction(s);
    for (var i = 1; i <= steps; i++) out.push(((p.pos + i * d) % n + n) % n);
    return out;
  }

  function nextAliveIdx(s, from) {
    var n = s.players.length;
    for (var i = 1; i <= n; i++) {
      var idx = (from + i) % n;
      if (isAlive(s.players[idx])) return idx;
    }
    return from;
  }

  function stackAt(s, tile) {
    var m = s.mines[tile];
    return m ? (m.count || 1) : 0;
  }

  /* ซ้อนได้เฉพาะบนทุ่นของตัวเอง และไม่เกิน MINE_STACK ลูก */
  function placementError(s) {
    var p = s.players[s.currentIdx];
    var m = s.mines[p.pos];
    if (s.ban && !sameTeam(s, s.ban.untilId, p.id)) return ERR.BANNED;
    if (p.mines === 0) return ERR.NO_MINE;
    if (m && m.ownerId !== p.id) return ERR.MINED;
    if (m && (m.count || 1) >= C.MINE_STACK) return ERR.STACK_FULL;
    return null;
  }

  /* เดินตามจำนวนก้าวที่เลือก แล้วตรวจช่องตามลำดับเดิม: ทุ่น -> ฐาน -> จุดเก็บ */
  function land(s, steps) {
    if (s.phase !== 'AWAIT_MOVE') return s;
    if (stepChoices(s.lastRoll).indexOf(steps) < 0) return s;   /* ก้าวนอกช่วงที่ทอยได้ */

    s = clone(s);
    var p = s.players[s.currentIdx];
    var roll = s.lastRoll;
    var dest = destOf(s, steps);
    p.pos = dest;
    log(s, 'move', (direction(s) < 0 ? 'moveBack' : 'move'),
      { p: p.id, a: roll.a, b: roll.b, steps: steps, tile: dest });

    var m = s.mines[dest];
    /* ไอเท็มเดินผ่านทุ่น: หยุดทับได้โดยไม่ระเบิด และทุ่นยังอยู่บนบอร์ดครบ */
    if (m && !sameTeam(s, m.ownerId, p.id) && s.turnMod && s.turnMod.kind === 'ghost') {
      log(s, 'safe', 'ghost', { p: p.id, owner: m.ownerId });
      m = null;
    }
    if (m && !sameTeam(s, m.ownerId, p.id)) {
      /* กองซ้อนระเบิดพร้อมกันทั้งกอง หักหัวใจทีเดียวแล้วหายไปทั้งหมด */
      var dmg = m.count || 1;
      delete s.mines[dest];

   ข้อดีคือไม่มีทางที่สองเครื่องคำนวณต่างกัน และคนเข้ามากลางเกมก็แค่ขอสถานะก้อนล่าสุด

   โมดูลนี้ไม่รู้จักกติกาของเกมเลย รู้แค่ว่าต้องส่งอะไรไปหาใคร */

  var conns = [];            /* ฝั่งเจ้าของห้อง: การเชื่อมต่อของผู้เข้าร่วมทุกคน */

    return new Promise(function (res, rej) {

  function seatNames() {

  function pick(seat) {

    conn.send({ k: 'pick', seat: seat });

  }

  var map={loading:'net_loading',signalling:'net_signal',hosting:'net_hosting',
    joined:'net_joined',seated:'net_seated',room_full:'net_full',host_left:'net_hostleft',
    guest_left:'net_guestleft',guest_open:'net_guestleft',no_lib:'net_nolib',
    no_signal:'net_nosignal',no_room:'net_noroom',code_taken:'net_taken',failed:'net_failed'};
  var k=map[key];
  netMsgKind=(kind==='bad')?'bad':(kind==='ok'?'ok':'');
  if(key==='guest_open'){ netMsg=t('net_wait',{n:Net.guests()}); }
  else if(k&&k!=='net_seated'){ netMsg=t(k,extra||{}); }

}

/* ---------- ห้องรอ ----------
   เจ้าของห้องถือความจริงเรื่องที่นั่ง ผู้เข้าร่วมเห็นรายการเดียวกันและกดเลือกเองได้
   ในโหมดทีม การเลือกที่นั่งคือการเลือกทีมไปในตัว เพราะทีมผูกกับตำแหน่งฐานสลับกัน */
var hostSeat=0;                 /* ที่นั่งของเจ้าของห้องเอง */
var lobbySeats=null;            /* ฝั่งผู้เข้าร่วม เก็บรายการที่ได้รับมา */
var lobbyTeams=false;

function seatFree(i){
  if(i<0||i>=playerCount) return false;
  if(pbots[i]) return false;                        /* ที่นั่งของคอมพิวเตอร์เลือกไม่ได้ */
  if(i===hostSeat) return false;
  return Net.takenSeats().indexOf(i)<0;
}

/* คนเพิ่งเข้ามา ยังไม่ให้ที่นั่ง ส่งรายการไปให้เลือกเอง */
function onHello(){ pushLobby(); }

/* ตัดสินคำขอย้ายที่นั่ง ใครส่งมาก่อนได้ก่อน */
function onPickSeat(seat,c){
  var cur=Net.seatOf(c);
  if(seat===cur) return cur;
  if(!seatFree(seat)) return cur;
  return seat;
}

/* สร้างรายชื่อผู้เล่นใหม่ทั้งชุดจากความจริงที่ชั้นเชื่อมต่อถืออยู่
   ทำแบบนี้แทนการไล่แก้ทีละเหตุการณ์ เพราะการย้ายที่นั่งคือการออกจากที่เก่าและเข้าที่ใหม่พร้อมกัน
   ถ้าแก้ทีละจุดจะลืมล้างที่เดิมเสมอ */
function refreshSeatNames(){
  var byName={};
  Net.seatNames().forEach(function(g){ if(g.seat>=0) byName[g.seat]=g.name; });
  for(var i=0;i<playerCount;i++){
    if(i===hostSeat||pbots[i]) continue;
    pnames[i]= byName[i] ? String(byName[i]).slice(0,14) : '';
  }
}

/* ที่นั่งเปลี่ยนแล้ว เจ้าของห้องเห็นทั้งในรายชื่อผู้เล่นและในรายการที่นั่งพร้อมกัน */
var seenSeats={};
function onSeatsChanged(seat){
  /* เขียนบันทึกเฉพาะตอนที่เพิ่งได้ที่นั่งครั้งแรก ไม่ใช่ทุกครั้งที่ย้ายที่ */
  if(seat>=0 && !seenSeats[seat]){ seenSeats[seat]=true; netLog('netJoin',seat); }
  refreshSeatNames();
  buildRoster();
  netMsg=t('net_wait',{n:Net.guests()});
  netMsgKind='';
  pushLobby();
}
/* เติมบรรทัดลงบันทึกของเกม ต้องสร้างสถานะใหม่ ไม่ใช่แก้ตัวเดิม
   เพราะระบบดูการเปลี่ยนแปลงจากตัวตนของวัตถุก่อนจะส่งต่อให้ผู้เข้าร่วม */
function netLog(key,seat){
  if(!S) return;
  var next=JSON.parse(JSON.stringify(S));
  /* ใช้เลขเทิร์นเดียวกับบรรทัดล่าสุด จะได้เรียงต่อกันสนิทไม่กระโดดกลับไปศูนย์ */
  var turn = next.log.length ? next.log[0].turn : (next.turnCount||1);
  next.log.unshift({ turn:turn, kind:'out', key:key, p:{ p:seat } });
  S=next;
}

function onSeatLeave(seat){
  if(seat>=0) netLog('netLeave',seat);
  refreshSeatNames();
  buildRoster();
  netMsg=t('net_wait',{n:Net.guests()});
  pushLobby();
  if(S) sync();
}

function seatList(){
  var taken=Net.isHost()?Net.takenSeats():[];
  var out=[];
  for(var i=0;i<playerCount;i++){
    out.push({
      i:i,
      team: teamMode ? (i%2) : -1,
      name: pnames[i]||defaultName(i),
      bot: !!pbots[i],
      host: i===hostSeat,
      taken: taken.indexOf(i)>=0
    });
  }
  return out;
}
function pushLobby(){
  if(!Net.isHost()) return;
  Net.sendLobby(seatList(), teamMode);
  buildNetRow();
}
function onLobby(seats,teams){ lobbySeats=seats; lobbyTeams=teams; buildNetRow(); }

/* ปิดตัวควบคุมทั้งหมดในหน้าตั้งค่าเมื่อเราไปเข้าห้องคนอื่น
   เรียกท้ายสุดของทุกการวาดใหม่ เพราะตัววาดแต่ละตัวตั้งค่า disabled ของตัวเอง */
/* ปิดตัวควบคุมในหน้าตั้งค่าเมื่อเราไปเข้าห้องคนอื่น เพราะการตั้งค่าเป็นสิทธิ์ของเจ้าของห้อง
   ตั้งเป็นปิดอย่างเดียว ไม่เปิดคืนเอง เพราะตัววาดแต่ละตัวมีกฎของตัวเองอยู่แล้ว
   เช่นโหมดทีมที่ปิดปุ่มจำนวนคนบางปุ่มไว้ ถ้าเปิดคืนตรงนี้จะไปลบกฎนั้นทิ้ง
   การปลดล็อกจึงทำด้วยการวาดใหม่ทั้งหมดตอนกดออกจากห้อง */
var lockBusy=false;
function applyGuestLock(){
  var root=$('setup'); if(!root||lockBusy) return;
  var lock=isGuest();
  root.classList.toggle('guestlock',lock);
  var keep=$('netrow');
  var nodes=root.querySelectorAll('button,input,select');
  Array.prototype.forEach.call(nodes,function(e){
    if(keep&&keep.contains(e)) return;          /* เลือกที่นั่งและออกจากห้องยังกดได้ */
    if(e.id==='btnItems') return;               /* ดูรายการไอเท็มได้ตลอด */
    if(e.id==='btnStart'&&isGuest()&&S&&steppedOut) return;   /* ปุ่มกลับเข้าเกมต้องกดได้ */
    e.disabled=lock;
  });
  var det=root.querySelector('details.adv');
  if(det&&lock) det.open=false;
  if(!lock){
    /* ปลดล็อกแล้วต้องคืนกฎเฉพาะทางที่การเปิดคืนไปลบทิ้ง เช่นโหมดทีมที่ปิดปุ่มจำนวนคนบางปุ่มไว้
       ตัวกันวนจำเป็น เพราะ buildCountState เรียกฟังก์ชันนี้กลับมาอีกที */
    lockBusy=true;
    buildCountState();
    lockBusy=false;
  }
}

/* เข้าห้องคนอื่นแล้วปิดทุกปุ่มที่ไม่ใช่เรื่องของเรา เพราะการตั้งค่าเป็นของเจ้าของห้อง
   ถ้าปล่อยให้กดได้จะเข้าใจผิดว่าเปลี่ยนได้ ทั้งที่ค่าจริงมาจากอีกเครื่อง */

function buildLobby(){
  if(!online()) return '';
  var list = Net.isHost() ? seatList() : lobbySeats;
  if(!list) return '';
  var me = Net.isHost() ? hostSeat : Net.seat();
  var html='<div class="lobby">';
  list.forEach(function(r){
    var mine=(r.i===me);
    var live=(r.taken&&!r.host);
    var who = r.bot ? t('seat_bot')
            : r.host ? (r.name+' \u00b7 '+t('seat_host'))
            : mine ? (r.name+' \u00b7 '+t('seat_you'))
            : r.taken ? r.name
            : t('seat_free');
    var tint = r.team===0?'#F2A0D4':(r.team===1?'#9FE4DC':'');
    html+='<div class="seatrow'+(mine?' mine':'')+(live?' live':'')+'">'+
      (r.team>=0?'<span class="tm" style="color:'+tint+'">'+esc(t('team_name',{n:r.team+1}))+'</span>':'')+
      '<span class="who">'+esc(who)+'</span>';
    /* กดเลือกได้เฉพาะที่นั่งว่างของคนจริง และเฉพาะฝั่งผู้เข้าร่วม */
    var canPick = isGuest() && !mine && !r.bot && !r.host && !r.taken;
    if(canPick) html+='<button type="button" data-seat="'+r.i+'">'+esc(t('seat_take'))+'</button>';
    else if(r.taken&&!r.host) html+='<span class="tag2 live">'+esc(t('seat_online'))+'</span>';
    else if(r.bot||r.host) html+='<span class="tag2">'+esc(r.bot?t('seat_bot'):t('seat_host'))+'</span>';
    html+='</div>';
  });
  return html+'</div>'+(isGuest()?'<p class="netmsg">'+esc(t('lobby_hint'))+'</p>'+
    '<p class="lockmsg">'+esc(t('guest_locked'))+'</p>':'');
}

/* กรรมการรับคำสั่งจากผู้เข้าร่วม ตรวจว่าถึงตาเขาจริงก่อนเสมอ */
function onRemoteAct(seat,a){
  if(!S||S.phase==='GAME_OVER') return;
  if(S.currentIdx!==seat) return;            /* ไม่ใช่ตาเขา ทิ้งไปเงียบ ๆ */
  if(a.k==='roll') $('btnRoll').onclick();
  else if(a.k==='move') pickStep(a.steps);
  else if(a.k==='place') doPlace();
  else if(a.k==='skipmine') doSkipMine();
  else if(a.k==='useitem') doUseItem();
}

var THEMES=['wood','steel','jungle','slate','paper'];
/* มุมมองเอียง: บีบระนาบกระดานตามแนวตั้งด้วยอัตราส่วนนี้ เท่ากับ cos ของมุมเอียงราว 53 องศา
   วิธีนี้ทำทั้งหมดในพิกัด SVG จึงไม่ต้องพึ่ง CSS 3D ที่ลูกในของ SVG เข้าไม่ถึง */
var TILT_K=0.60;
var view='flat';
function tilted(){ return view==='tilt' }
function projY(y){ return tilted() ? geo.cy + (y-geo.cy)*TILT_K : y }
/* พิกัดสำหรับของที่ต้องตั้งขึ้น เช่นตัวละคร ทุ่นระเบิด และตัวหนังสือ */
function pxy(i,off){ var q=xy(i,off); return {x:q.x, y:projY(q.y)} }
/* ยิ่งอยู่ใกล้ตายิ่งใหญ่ขึ้นเล็กน้อย ช่วยให้อ่านความลึกได้ */
function depthScale(y){
  if(!tilted()) return 1;
  var f=(y-0)/(geo.boxH||1);
  return 0.86+0.28*Math.max(0,Math.min(1,f));
}

/* สุ่มชื่อประจำตัวครั้งเดียวตอนเปิดหน้า เก็บเป็นดัชนีในคลังชื่อ
   สลับภาษาแล้วชื่อจึงเปลี่ยนตามภาษาโดยยังเป็นคนเดิม */
var nameIdx=(function(){
  var n=DICT.th.pool.length, pick=[], out=[];
  for(var i=0;i<n;i++) pick.push(i);
  for(var j=pick.length-1;j>0;j--){
    var r=Math.floor(Math.random()*(j+1)), tmp=pick[j]; pick[j]=pick[r]; pick[r]=tmp;
  }
  for(var k=0;k<6;k++) out.push(pick[k]);
  return out;
})();
function defaultName(id){
  var pool=D().pool||DICT.th.pool;
  return pool[nameIdx[id]%pool.length];
}

var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function D(){ return DICT[lang] }
function fmt(str,p){ return String(str).replace(/\{(\w+)\}/g,function(_,k){ return (p&&p[k]!==undefined)?p[k]:'' }) }
function t(key,p){ var v=D()[key]; if(v===undefined) v=DICT.th[key]; return fmt(v,p) }
/* ชื่อที่ผู้ใช้พิมพ์เองไหลเข้า innerHTML ได้ ต้อง escape ก่อนเสมอ */
function esc(v){ return String(v).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c] }) }
/* name เป็น null แปลว่าใช้ชื่อมาตรฐาน จึงยังเปลี่ยนตามภาษาได้ */
/* รายการไอเท็มทั้งหมดสำหรับดูก่อนเริ่มเกม อ่านจากตัวโมดูลโดยตรง
   ถ้าวันหลังเพิ่มไอเท็มใหม่ หน้านี้จะขึ้นเองโดยไม่ต้องมาแก้ */
function buildItemList(){
  var box=$('itemsBody'); if(!box) return;
  box.innerHTML='';
  Game.ITEMS.forEach(function(it,i){
    var row=document.createElement('div'); row.className='irow';
    var kind=t(it.kind==='now'?'item_kind_now':'item_kind_turn');
    row.innerHTML='<span class="no">'+String(i+1).padStart(2,'0')+'</span>'+
      '<span class="txt"><b>'+esc(itemName(it.key))+'<span class="kd">'+kind+'</span></b>'+
      '<span>'+esc(itemDesc(it.key))+'</span></span>';
    box.appendChild(row);
  });
}
function itemName(key){ var it=D().items[key]||DICT.th.items[key]; return it?it[0]:key }
function itemDesc(key){
  /* โหมดทีมมีคำอธิบายฉบับของตัวเองเฉพาะไอเท็มที่พฤติกรรมต่างกันจริง
     ที่เหลือใช้ฉบับเดียวกันทั้งสองโหมด จะได้ไม่ต้องดูแลข้อความซ้ำซ้อน */
  if(inTeams()){
    var tm=(D().itemsTeam||{})[key]||(DICT.th.itemsTeam||{})[key];
    if(tm) return tm;
  }
  var it=D().items[key]||DICT.th.items[key];
  return it?it[1]:'';
}
/* โหมดทีมกับโหมดเดี่ยวใช้ชุดสีคนละชุด หน้าตั้งค่าจึงต้องเปลี่ยนตามปุ่มที่กดค้างไว้
   ระหว่างเล่นให้ยึดตามที่เกมสร้างจริง ไม่ใช่ตามปุ่มที่หน้าตั้งค่า */
function inTeams(){ return S ? !!S.rules.teams : teamMode; }
function unitSet(){
  /* ธีมพื้นสว่างต้องใช้ชุดสีเข้ม ไม่งั้นหมากจมหายไปกับพื้น */

/* สีที่ใช้วาดจริง อ่านจากชุดปัจจุบันเสมอ ไม่ใช่จากที่ฝังไว้ตอนสร้างเกม
   ทำให้สลับธีมกลางเกมแล้วหมากเปลี่ยนสีตามทันที */
function colOf(p){ var u=unitSet()[p.id]; return (u&&u.color)||p.color; }

var OPTS=[
  {key:'opt_hp', get:function(){return cfg.hpStart}, set:function(v){cfg.hpStart=v},
   lo:function(){return 1}, hi:function(){return Game.C.HP_HARD_MAX}},
  {key:'opt_start', get:function(){return cfg.mineStart}, set:function(v){cfg.mineStart=v},
   lo:function(){return 0}, hi:function(){return cfg.mineMax}},
  {key:'opt_max', get:function(){return cfg.mineMax}, set:function(v){cfg.mineMax=v; if(cfg.mineStart>v) cfg.mineStart=v},
   lo:function(){return 1}, hi:function(){return Game.C.MINE_HARD_MAX}},
  {key:'opt_spacing', get:function(){return cfg.spacing},
   set:function(v){ cfg.spacing=v; var m=Game.maxCaches(v); if(cfg.caches>m) cfg.caches=m },
   lo:function(){return Game.C.SPACING_MIN}, hi:function(){return Game.C.SPACING_MAX}},
  /* ต่ำสุด 1 ไม่ใช่ 0: ถ้าไม่มีจุดเก็บเลย ทุ่นทั้งเกมมีจำนวนจำกัด

      });

        Array.prototype.forEach.call(document.querySelectorAll('.tokpop'),function(x){ x.classList.add('hidden') });

/* ผู้เข้าร่วมได้สถานะใหม่มา วาดใหม่ทั้งกระดานเมื่อโครงเปลี่ยน ไม่งั้นแค่รีเฟรช */
var remoteRolling=false;

/* ลายเซ็นของสิ่งที่ถูกวาดครั้งเดียวตอนสร้างกระดาน แล้วไม่ถูกวาดซ้ำระหว่างเล่น
   ได้แก่ผังช่อง ตำแหน่งฐาน จุดเก็บทุ่นระเบิด และการพลิกผัง
   ถ้าอย่างใดอย่างหนึ่งเปลี่ยน ต้องสร้างกระดานใหม่ ไม่งั้นภาพสองฝั่งจะไม่ตรงกัน
   กรณีที่เจอคือเจ้าของห้องกดเริ่มใหม่ด้วยค่าเดิม แต่จุดเก็บถูกสุ่มใหม่ */
function boardSig(st){
  if(!st) return '';
  return [st.boardSize, st.players.length, st.rules.shape, st.rules.teams,
          JSON.stringify(st.flip||{}), (st.startTiles||[]).join(','),
          Object.keys(st.caches||{}).sort(function(a,b){return a-b}).join(',')].join('|');
}

function onRemoteState(st){
  var prev=S;
  var needBoard = !S || boardSig(S)!==boardSig(st);

  /* จับจังหวะที่มีคนเพิ่งทอย โดยดูการเปลี่ยนเข้าสู่ช่วงเลือกก้าว
     วิธีนี้แม่นกว่าการเทียบแต้ม เพราะทอยได้แต้มเดิมซ้ำกันสองครั้งก็ยังจับได้ */
  var justRolled = st.phase==='AWAIT_MOVE' && st.lastRoll && prev &&
    (prev.phase!=='AWAIT_MOVE' || prev.currentIdx!==st.currentIdx || prev.turnCount!==st.turnCount);

  S=st;
  if(steppedOut){
    /* ยังดูอยู่ที่หน้าตั้งค่า เก็บสถานะไว้เฉย ๆ ไม่ดึงกลับเข้าเกมเอง */
    refreshRoomButtons();
    return;
  }
  if(needBoard){
    $('setup').classList.add('hidden');
    $('game').classList.remove('hidden');
    geo=geometry();
    buildBoard();
  }
  sync();

  /* หมุนลูกเต๋าให้ดูหลังวาดเสร็จ จะได้เห็นว่าคนที่กำลังเล่นทอยได้เท่าไร */
  if(justRolled && !remoteRolling){
    remoteRolling=true;
    sync();                                   /* ซ่อนปุ่มเลือกก้าวไว้ก่อนระหว่างลูกเต๋ายังหมุน */
    tumbleDice(st.lastRoll).then(function(){
      remoteRolling=false;
      sync();                                 /* หมุนจบแล้วค่อยให้กดเลือกก้าว */
    });
  }
}

/* ---------- geometry ---------- */
/* กรอบบนจอโตตามจำนวนช่อง ไม่งั้นบอร์ด 90 ช่องจะเล็กจนอ่านไม่ออก
   ส่วนรูปทรงจริงคำนวณโดยโมดูล Geom ซึ่งคืนพิกัดทุกช่องพร้อมเวกเตอร์ตั้งฉาก */
function geometry(){
  var size=S.boardSize;
  var maxW=Math.max(520,Math.min(780,Math.round(480+size*3)));
  var boxW=1000, boxH=Math.round(boxW*(S.rules.shape==='snake'?0.62:0.78));
  var L=Geom.layout({shape:S.rules.shape, sides:S.players.length, tiles:size,
                     W:boxW, H:boxH, maxTile:34,
                     flip:S.rules.flip});
  return {L:L, tileR:L.tileR, boxW:boxW, boxH:boxH, maxW:maxW,
          cx:boxW/2, cy:boxH/2};
}

/* i เป็นทศนิยมได้ เพราะการเดินทีละช่องใช้ตำแหน่งระหว่างช่อง
   off คือระยะเลื่อนไปตามเวกเตอร์ตั้งฉาก ใช้ยกหมุดตอนกระโดดและวางป้ายฐาน */
function xy(i,off){
  var pts=geo.L.pts, n=pts.length;
  var f=((i%n)+n)%n, i0=Math.floor(f), u=f-i0;
  var a=pts[i0], b=pts[(i0+1)%n];
  var x=a.x+(b.x-a.x)*u, y=a.y+(b.y-a.y)*u;
  if(off){
    var nx=a.nx+(b.nx-a.nx)*u, ny=a.ny+(b.ny-a.ny)*u;
    var m=Math.hypot(nx,ny)||1;
    /* บนแบบรถไฟแถวคู่กับแถวคี่หันตั้งฉากคนละทาง บังคับให้ยกขึ้นเสมอจะอ่านง่ายกว่า */
    if(S.rules.shape==='snake'&&ny>0){ nx=-nx; ny=-ny; }
    x+=nx/m*off; y+=ny/m*off;
  }
  return {x:x,y:y};
}
function el(tag,attrs){
  var e=document.createElementNS('http://www.w3.org/2000/svg',tag);
  for(var k in attrs) e.setAttribute(k,attrs[k]);
  return e;
}

/* ---------- board ---------- */
/* วาดพื้นราง: แบบรถไฟได้รางจริงพร้อมหมอนรองและชานชาลาเกาะกลาง
   แบบอื่นได้เส้นนำสายตาจาง ๆ เหมือนเดิม */
function drawTrack(svg){
  var L=geo.L, g=el('g',{'class':'track'});

  if(S.rules.shape==='snake'){
    /* ชานชาลาเกาะกลางใต้แถวตรง ช่องจะดูเหมือนวางอยู่บนชานชาลาสถานี */
    (L.rows||[]).forEach(function(r){
      var pad=geo.tileR*1.35;
      g.appendChild(el('rect',{x:Math.min(r.x1,r.x2)-pad,y:r.y-geo.tileR*1.15,
        width:Math.abs(r.x2-r.x1)+pad*2,height:geo.tileR*2.3,rx:geo.tileR*1.15,
        'class':'platform'}));
    });

    /* หมอนรองวางตั้งฉากกับรางทุก ๆ ระยะ */
    var ties=el('g',{'class':'tie'});
    L.samples.forEach(function(p,i){
      if(i%3) return;
      var w=geo.tileR*0.95;
      ties.appendChild(el('line',{x1:p.x+p.nx*w,y1:p.y+p.ny*w,
                                  x2:p.x-p.nx*w,y2:p.y-p.ny*w}));
    });
    g.appendChild(ties);

    /* รางสองเส้นขนาบ */
    [1,-1].forEach(function(sgn){
      var d='', off=geo.tileR*0.5;
      L.samples.forEach(function(p,i){
        d+=(i?'L':'M')+(p.x+p.nx*off*sgn).toFixed(1)+' '+(p.y+p.ny*off*sgn).toFixed(1);
      });
      g.appendChild(el('path',{d:d+'Z','class':'rail'}));
    });
  } else {
    var d='';
    L.pts.forEach(function(p,i){ d+=(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1); });
    g.appendChild(el('path',{d:d+'Z','class':'guide'}));
  }
  svg.appendChild(g);
}

function buildBoard(){
  /* กลางกระดานว่างเฉพาะแบบวงกลมกับ n เหลี่ยม แบบรถไฟมีช่องอยู่ตรงนั้น ต้องย้ายลูกเต๋าออกมา */
  var onBoard=(S.rules.shape!=='snake');
  (onBoard?$('hudBoard'):$('hudBar')).appendChild($('hud'));
  $('hud').classList.toggle('bar',!onBoard);

  var svg=$('board');
  /* หมุดผู้เล่นชี้ออกนอกรางไปราว 1.8 เท่าของรัศมีช่อง และป้ายชื่อฐานอยู่ไกลกว่านั้นอีก
     กรอบเดิมเผื่อไว้แค่รัศมีช่อง หัวหมุดของช่องริมนอกจึงโดนตัด ต้องขยายกรอบออกทุกด้าน */
  /* จอแคบมีพื้นที่จำกัด ลดขอบเผื่อรอบกระดานลงเพื่อให้ช่องใหญ่ที่สุดเท่าที่ทำได้
     ยังเหลือพอสำหรับหัวตัวละครที่สูงราว 2 เท่าของรัศมีช่อง */
  var narrow=(window.innerWidth||1024)<640;
  var pad=Math.round(geo.tileR*(narrow?1.35:1.9)+(narrow?16:34));
  /* มุมมองเอียงบีบระนาบตามแนวตั้ง กรอบมองภาพจึงเตี้ยลงตามไปด้วย ไม่งั้นจะเหลือที่ว่างเปล่า */
  var vh=tilted() ? geo.boxH*TILT_K : geo.boxH;
  var vy=tilted() ? geo.cy - vh/2 : 0;
  svg.setAttribute('viewBox',(-pad)+' '+(vy-pad)+' '+(geo.boxW+pad*2)+' '+(vh+pad*2));
  /* ขยายความกว้างบนจอตามสัดส่วนที่เพิ่ม เพื่อให้ขนาดช่องที่เห็นจริงเท่าเดิม */
  svg.style.maxWidth=Math.round(geo.maxW*(geo.boxW+pad*2)/geo.boxW)+'px';
  svg.innerHTML='';

  /* ชั้นระนาบ ของที่ควรนอนราบไปกับพื้นกระดาน ถูกบีบทั้งกลุ่มด้วยการแปลงพิกัดครั้งเดียว
     ชั้นตั้งขึ้น ของที่ควรยืนตรง วาดด้วยพิกัดที่ฉายแล้วและไม่ถูกบีบ */
  var plane=el('g',{id:'plane'});
  if(tilted()) plane.setAttribute('transform',
    'translate(0,'+geo.cy.toFixed(2)+') scale(1,'+TILT_K+') translate(0,'+(-geo.cy).toFixed(2)+')');
  svg.appendChild(plane);

  drawTrack(plane);
  var tiles=el('g',{});
  var upright=el('g',{id:'upright'});
  var pending=[];
  for(var i=0;i<S.boardSize;i++){
    var p=xy(i);
    var owner=S.startTiles.indexOf(i);
    var cls='tile'+(owner>=0?' start':'')+(S.caches[i]?' cache':'');
    var c=el('circle',{cx:p.x,cy:p.y,r:geo.tileR,'class':cls,id:'tile'+i});
    if(owner>=0) c.setAttribute('stroke',colOf(S.players[owner]));
    tiles.appendChild(c);
    if(owner>=0||geo.tileR>=13||i%6===0){
      var tp=pxy(i);
      var tx=el('text',{x:tp.x,y:tp.y,'class':'tnum','font-size':Math.max(7,Math.min(11,Math.round(geo.tileR*0.7)))});
      tx.textContent=i; upright.appendChild(tx);
    }
    if(owner>=0){
      var col=colOf(S.players[owner]);
      /* กรอบสี่เหลี่ยมเส้นประครอบช่องฐาน เพราะวงกลมเส้นหนาอย่างเดียวยังกลืนไปกับช่องอื่น */
      var box=geo.tileR+5;
      tiles.appendChild(el('rect',{x:p.x-box,y:p.y-box,width:box*2,height:box*2,rx:3,
        'class':'basebox',stroke:col}));
      /* รูปบ้านแล้วตามด้วยชื่อผู้เล่น จัดกึ่งกลางทีหลังเพราะต้องวัดความกว้างข้อความจริงก่อน */
      var grp=el('g',{});
      grp.appendChild(el('path',{d:'M0 -0.5 L4.5 -5 L9 -0.5 L9 3.5 L0 3.5 Z',fill:col}));
      var nm=el('text',{x:13,y:0,'class':'slabel',fill:col});
      nm.textContent=uname(owner);
      grp.appendChild(nm);
      upright.appendChild(grp);
      pending.push({grp:grp,txt:nm,lp:pxy(i,geo.tileR+15)});
    }
  }
  plane.appendChild(tiles);
  pending.forEach(function(o){
    var w=0;
    try { w=o.txt.getComputedTextLength(); } catch(e) { w=uname(0).length*5.5; }
    o.grp.setAttribute('transform','translate('+(o.lp.x-(13+w)/2)+','+o.lp.y+')');
  });
  svg.appendChild(upright);
  svg.appendChild(el('g',{id:'caches'}));
  svg.appendChild(el('g',{id:'mines'}));
  svg.appendChild(el('g',{id:'tokens'}));
  svg.appendChild(el('g',{id:'picks'}));
  svg.appendChild(el('g',{id:'fx'}));
}

/* เครื่องหมายจุดเก็บทุ่นโผล่เฉพาะตอนช่องนั้นยังไม่มีทุ่นทับ เพราะทุ่นบังตรงกลางพอดี */
function drawCaches(){
  var g=$('caches'); g.innerHTML='';
  Object.keys(S.caches).forEach(function(k){
    if(S.mines[k]) return;
    var p=pxy(+k);
    var tx=el('text',{x:p.x,y:p.y,'class':'cglyph','font-size':Math.max(8,Math.round(geo.tileR*0.85))});
    tx.textContent='+';
    g.appendChild(tx);
  });
}

/* ทุ่นระเบิดทะเล: ตัวกลมพร้อมหนาม จำนวนหนามบอกจำนวนทุ่นในช่อง
   ทุ่นเดียว 4 ทิศ กองซ้อน 8 ทิศ อ่านความอันตรายได้จากรูปทรงโดยไม่ต้องนับ */
/* ky คืออัตราส่วนการบีบแนวตั้งของระนาบ ใส่ 1 เมื่อมองจากบน
   เมื่อมองเอียง หนามจะกางไปตามพื้นจึงถูกบีบตาม ส่วนตัวลูกยังกลมเพราะเป็นทรงกลม
   ผลคือวงหนามกลายเป็นวงรีที่พอดีกับช่อง และลูกกลมนั่งอยู่ตรงกลางวงนั้น */
function drawMineIcon(g,cx,cy,R,color,spikeCount,ky){
  var n=spikeCount||4, k=(ky===undefined?1:ky);
  var tilt=(k<0.999);
  var spikes=el('g',{stroke:color,'stroke-width':Math.max(1.2,R*(n>4?0.22:0.26)),'stroke-linecap':'round'});
  for(var i=0;i<n;i++){
    var a=-Math.PI/2 + i*(Math.PI*2/n);
    spikes.appendChild(el('line',{
      x1:cx+Math.cos(a)*R*0.52, y1:cy+Math.sin(a)*R*0.52*k,
      x2:cx+Math.cos(a)*R,      y2:cy+Math.sin(a)*R*k}));
  }
  g.appendChild(spikes);
  var lift=tilt?R*0.20:0, br=tilt?R*0.55:R*0.62;
  g.appendChild(el('circle',{cx:cx,cy:cy-lift,r:br,'class':'mine',fill:color}));
  g.appendChild(el('ellipse',{cx:cx-br*0.32,cy:cy-lift-br*0.44,rx:br*0.42,ry:br*0.26,'class':'sheen'}));
}

function drawMines(){
  var g=$('mines'); g.innerHTML='';
  Object.keys(S.mines).forEach(function(k){
    var p=pxy(+k), owner=S.players[S.mines[k].ownerId], R=geo.tileR*0.88;
    var stacked=(S.mines[k].count||1)>1;
    /* มีคนยืนอยู่บนช่องนี้ หรี่ทุ่นลงเล็กน้อยเพื่อให้หมุดผู้เล่นเด่นกว่า */
    var occupied=S.players.some(function(pl){ return pl.hp>0 && pl.pos===+k });
    var gg=el('g',occupied?{opacity:'0.68'}:{});
    g.appendChild(gg);

    var Rm=stacked?R*1.06:R;
    var ky=tilted()?TILT_K:1;
    drawMineIcon(gg,p.x,p.y,Rm,colOf(owner),stacked?8:4,ky);
    /* ตัวอักษรอยู่กลางลูกกลม ซึ่งถูกยกขึ้นเล็กน้อยเมื่อมองเอียง */
    var br=tilted()?Rm*0.55:Rm*0.62, cy=p.y-(tilted()?Rm*0.20:0);
    var fs=Math.max(7,Math.round(br*1.06));
    if(fs<=br*2){
      var lb=el('text',{x:p.x,y:cy,'class':'mlabel','font-size':fs});
      lb.textContent=owner.letter;
      gg.appendChild(lb);
    }
  });
}

/* เวกเตอร์ตั้งฉากที่ตำแหน่งทศนิยม ใช้หันหมุดให้ชี้ออกนอกรางเสมอ */
function nrm(i){
  var pts=geo.L.pts, n=pts.length;
  var f=((i%n)+n)%n, i0=Math.floor(f), u=f-i0;
  var a=pts[i0], b=pts[(i0+1)%n];
  var nx=a.nx+(b.nx-a.nx)*u, ny=a.ny+(b.ny-a.ny)*u;
  var m=Math.hypot(nx,ny)||1; nx/=m; ny/=m;
  if(S.rules.shape==='snake'&&ny>0){ nx=-nx; ny=-ny; }
  return {nx:nx,ny:ny};
}

/* ตัวละครผู้เล่นตั้งขึ้นทิศเหนือเสมอ ไม่หันตามแนวรางแล้ว จึงอ่านเป็นตัวละครจริง ๆ
   ทุกรูปทรงยึดปลายล่างไว้ที่กึ่งกลางช่องเหมือนกัน และมีเงาทอดที่ปลายเพื่อบอกว่ายืนตรงไหน */
/* หกรูปทรงเท่าจำนวนผู้เล่นสูงสุด ทุกคนจึงมีของตัวเองได้โดยไม่ซ้ำกัน */
var TOKEN_SHAPES=['pin','flag','pawn','shield','star','kite'];
var tokenShapes=TOKEN_SHAPES.slice();

function tokenParts(shape,R){
  var n=function(v){ return (v*R).toFixed(2) };
  if(shape==='flag') return {
    pole:{x1:0,y1:0,x2:0,y2:-2.05*R,w:Math.max(1.6,R*0.16)},
    path:'M'+n(0.05)+' '+n(-2.05)+' L'+n(1.25)+' '+n(-1.62)+' L'+n(0.05)+' '+n(-1.2)+' Z',
    lx:0.46*R, ly:-1.62*R, lr:0.30*R, sx:0.32*R, sy:-1.86*R
  };
  if(shape==='pawn') return {
    path:'M'+n(-0.58)+' 0 L'+n(0.58)+' 0 L'+n(0.42)+' '+n(-0.34)+
         ' C'+n(0.42)+' '+n(-0.76)+' '+n(0.28)+' '+n(-0.95)+' '+n(0.28)+' '+n(-1.16)+
         ' L'+n(-0.28)+' '+n(-1.16)+
         ' C'+n(-0.28)+' '+n(-0.95)+' '+n(-0.42)+' '+n(-0.76)+' '+n(-0.42)+' '+n(-0.34)+' Z',
    head:{cx:0,cy:-1.55*R,r:0.44*R},
    lx:0, ly:-1.55*R, lr:0.44*R, sx:-0.16*R, sy:-1.74*R
  };
  if(shape==='star'){
    /* ดาวห้าแฉกโดยให้แฉกล่างแตะกึ่งกลางช่องพอดี */
    var cy=-0.95*R, ro=0.95*R, ri=0.42*R, d='';
    for(var si=0;si<10;si++){
      var a=Math.PI/2 + si*Math.PI/5, rr=(si%2?ri:ro);
      d+=(si?'L':'M')+(Math.cos(a)*rr).toFixed(2)+' '+(cy+Math.sin(a)*rr).toFixed(2)+' ';
    }
    return { path:d+'Z', lx:0, ly:cy, lr:0.42*R, sx:-0.2*R, sy:cy-0.34*R };
  }
  if(shape==='kite') return {
    path:'M0 0 L'+n(-0.6)+' '+n(-0.9)+' L0 '+n(-1.9)+' L'+n(0.6)+' '+n(-0.9)+' Z',
    lx:0, ly:-1.0*R, lr:0.5*R, sx:-0.18*R, sy:-1.3*R
  };
  if(shape==='shield') return {
    path:'M0 0 L'+n(-0.64)+' '+n(-0.95)+' L'+n(-0.64)+' '+n(-1.74)+
         ' L'+n(0.64)+' '+n(-1.74)+' L'+n(0.64)+' '+n(-0.95)+' Z',
    lx:0, ly:-1.30*R, lr:0.56*R, sx:-0.24*R, sy:-1.55*R
  };
  return {   /* หมุดปัก */
    path:'M0 0 L'+n(-0.62)+' '+n(-1.0)+
         ' A '+n(0.72)+' '+n(0.72)+' 0 1 1 '+n(0.62)+' '+n(-1.0)+' Z',
    lx:0, ly:-1.37*R, lr:0.72*R, sx:-0.24*R, sy:-1.62*R
  };
}

/* ไอคอนย่อของตัวละคร ใช้พิกัดชุดเดียวกับที่วาดบนกระดาน จึงตรงกันเสมอ
   ต่อให้วันหลังปรับรูปทรง ไอคอนในหน้าตั้งค่าก็เปลี่ยนตามเอง */
function tokenIcon(shape,color,px){
  var k=tokenParts(shape,1);
  var out='<svg viewBox="-1.35 -2.2 2.7 2.45" width="'+px+'" height="'+Math.round(px*2.45/2.7)+
    '" aria-hidden="true">';
  if(k.pole) out+='<line x1="0" y1="0" x2="0" y2="'+k.pole.y2.toFixed(2)+'" stroke="'+color+
    '" stroke-width="0.17" stroke-linecap="round"/>';
  out+='<path d="'+k.path+'" fill="'+color+'" class="tokline" stroke-width="0.09" stroke-linejoin="round"/>';
  if(k.head) out+='<circle cx="0" cy="'+k.head.cy.toFixed(2)+'" r="'+k.head.r.toFixed(2)+
    '" fill="'+color+'" class="tokline" stroke-width="0.09"/>';
  return out+'</svg>';
}

function drawToken(g,idx,p,off,active){
  var pos=pxy(idx,off||0);
  var R=Math.max(7,geo.tileR*0.86);
  var k=tokenParts(tokenShapes[p.id]||'pin',R);
  var grp=el('g',{transform:'translate('+pos.x.toFixed(2)+','+pos.y.toFixed(2)+')'});

  /* เงาอยู่นอกกลุ่มที่ลอย จึงติดพื้นไว้ตลอดและจางลงตอนตัวละครลอยขึ้น */
  grp.appendChild(el('ellipse',{cx:0,cy:0,rx:R*0.5,ry:R*0.22,'class':'pinshadow'}));

  var body=el('g',active?{'class':'blink'}:{});
  if(k.pole) body.appendChild(el('line',{x1:k.pole.x1,y1:k.pole.y1,x2:k.pole.x2,y2:k.pole.y2,
    'class':'tokpole',stroke:colOf(p),'stroke-width':k.pole.w}));
  body.appendChild(el('path',{d:k.path,'class':'pin',fill:colOf(p)}));
  if(k.head) body.appendChild(el('circle',{cx:k.head.cx,cy:k.head.cy,r:k.head.r,'class':'pin',fill:colOf(p)}));
  body.appendChild(el('ellipse',{cx:k.sx,cy:k.sy,rx:R*0.24,ry:R*0.15,'class':'sheen'}));
  if(active) body.appendChild(el('circle',{cx:k.lx,cy:k.ly,r:k.lr*1.28,'class':'pinring',stroke:colOf(p)}));
  if(S.rules.teams){
    var bw=R*0.62;
    body.appendChild(el('rect',{x:-bw/2,y:-R*0.30,width:bw,height:R*0.2,rx:R*0.06,
      'class':'pinteam',fill:p.team===0?'#F2A0D4':'#9FE4DC'}));
  }
  var fs=Math.round(k.lr*1.18);
  if(fs>=8){
    var tl=el('text',{x:k.lx,y:k.ly,'class':'pinletter','font-size':fs});
    tl.textContent=p.letter;
    body.appendChild(tl);
  }
  grp.appendChild(body);
  g.appendChild(grp);
}

function drawTokens(){
  var g=$('tokens'); g.innerHTML='';
  var byTile={}, over=(S.phase==='GAME_OVER');
  S.players.forEach(function(p){
    if(p.hp<=0) return;
    if(animTok&&animTok.id===p.id) return;
    (byTile[p.pos]=byTile[p.pos]||[]).push(p);
  });
  /* วาดเรียงจากบนลงล่าง ตัวที่อยู่ล่างจึงทับตัวที่อยู่บน ตรงกับที่สายตาคาดหวัง */
  var queue=[];
  Object.keys(byTile).forEach(function(k){
    var list=byTile[k];
    list.forEach(function(p,n){
      /* หลายคนอยู่ช่องเดียวกัน เลื่อนไปตามแนวรางทีละนิด ไม่ใช่กระจายเป็นวง
         จะได้ยังเห็นว่าทุกคนอยู่ช่องเดียวกัน */
      var spread=(list.length>1) ? (n-(list.length-1)/2)*0.34 : 0;
      queue.push({idx:+k+spread, p:p, active:!over&&p.id===S.currentIdx});
    });
  });
  queue.sort(function(a,b){ return xy(a.idx).y - xy(b.idx).y });
  queue.forEach(function(q){ drawToken(g,q.idx,q.p,0,q.active) });

  if(animTok){
    var mv=S.players[animTok.id];
    drawToken(g,animTok.idx,mv,animTok.lift,true);
  }
}

/* วงกระเพื่อมสำหรับเน้นเหตุการณ์บนช่อง วาดด้วย rAF เพราะ CSS animate r ไม่ได้ทุกเบราว์เซอร์ */
function pulseAt(tile,color,scale){
  var layer=$('fx'); if(!layer) return;
  var p=pxy(tile);
  /* วงกระเพื่อมแผ่ไปบนพื้นกระดาน จึงเป็นวงรีเมื่อมองเอียง */
  var ky=tilted()?TILT_K:1;
  var c=el('ellipse',{cx:p.x,cy:p.y,rx:geo.tileR*0.6,ry:geo.tileR*0.6*ky,
    fill:'none',stroke:color,'stroke-width':2.5});
  layer.appendChild(c);
  var t0=null, dur=440, grow=geo.tileR*(scale||1.5);
  function frame(ts){
    if(t0===null) t0=ts;
    var k=Math.min(1,(ts-t0)/dur);
    var rr=geo.tileR*0.6+grow*k;
    c.setAttribute('rx',rr);
    c.setAttribute('ry',rr*ky);
    c.setAttribute('opacity',(1-k)*0.75);
    if(k<1) requestAnimationFrame(frame); else if(c.parentNode) c.parentNode.removeChild(c);
  }
  requestAnimationFrame(frame);
}

/* ตัวเลขลอยขึ้นจากช่อง บอกทันทีว่าได้หรือเสียอะไรไปเท่าไร */
function floatText(tile,text,color){
  var layer=$('fx'); if(!layer) return;
  var p=pxy(tile);
  var t=el('text',{x:p.x,y:p.y,'class':'floater',fill:color,
    'font-size':Math.max(11,Math.round(geo.tileR*0.95))});
  t.textContent=text;
  layer.appendChild(t);
  var t0=null, dur=900;
  function frame(ts){
    if(t0===null) t0=ts;
    var k=Math.min(1,(ts-t0)/dur);
    t.setAttribute('y',p.y-geo.tileR*1.6*k);
    t.setAttribute('opacity', k<0.15 ? k/0.15 : 1-(k-0.15)/0.85);
    if(k<1) requestAnimationFrame(frame); else if(t.parentNode) t.parentNode.removeChild(t);
  }
  requestAnimationFrame(frame);
}

function blastAt(tile){
  var t=$('tile'+tile);
  if(t){ t.classList.add('blast'); setTimeout(function(){t.classList.remove('blast')},700); }
  pulseAt(tile,'#9E2B24',2.2);
  setTimeout(function(){ pulseAt(tile,'#9E2B24',1.6) },120);
  var st=document.querySelector('.stage');
  st.classList.add('shake'); setTimeout(function(){st.classList.remove('shake')},430);
}

/* เดินทีละช่องด้วย ease-in-out ต่อช่อง ได้จังหวะกระโดดแบบหมากกระดาน
   ตำแหน่งเป็นเลขทศนิยม ส่งเข้า xy() ตรง ๆ ได้เลยเพราะสูตรมุมรับค่าเศษส่วนอยู่แล้ว */
/* dir เป็น 1 หรือ -1 ไอเท็มถอยหลังทำให้หมากต้องวิ่งย้อนทางจริง ๆ ไม่ใช่วิ่งไปข้างหน้า
   แล้วค่อยโผล่ที่ปลายทาง ส่วนไอเท็มเร่งเครื่องทำให้ก้าวเยอะขึ้น จึงต้องเร่งจังหวะตามด้วย */
function animateMove(id,from,steps,dir){
  var d=(dir<0)?-1:1;
  return new Promise(function(done){
    var per=steps>8?115:(steps>6?150:185);
    var t0=null, total=steps*per, lastStep=-1;
    function frame(ts){
      if(t0===null) t0=ts;
      var k=Math.min(1,(ts-t0)/total);
      var raw=k*steps;
      var i=Math.min(steps-1,Math.floor(raw));
      var f=raw-i;
      var eased=f<0.5 ? 2*f*f : 1-Math.pow(-2*f+2,2)/2;
      if(i!==lastStep){ lastStep=i; Sfx.play('step',i); }
      animTok={id:id, idx:from+d*(i+eased), lift:Math.sin(Math.PI*f)*geo.tileR*0.6};
      drawTokens();
      if(k<1) requestAnimationFrame(frame);
      else { animTok=null; drawTokens(); done(); }
    }
    requestAnimationFrame(frame);
  });
}

/* เต๋าสองลูกทิ้งตัวพร้อมกัน หน้าสลับถี่แล้วค่อย ๆ ช้าลง ปิดท้ายด้วยจังหวะกระแทกลง */
/* แผนที่จาก log key ไปเสียง ใช้กลไก log-diff เดิมที่คำนวณอยู่แล้ว ไม่ต้องเดินสายใหม่ */
var SFX={boom:'blast', boomstack:'blast2', heal:'heal', supply:'pickup',
         place:'plant', stack:'plant2', forced:'alert', out:'death', win:'fanfare'};

function tumbleDice(roll){
  var A=$('dieA'), Bd=$('dieB');
  if(reduced){ drawDie('dieA',roll.a); drawDie('dieB',roll.b); return Promise.resolve() }
  var delays=[40,44,52,64,80,100,126,158,196];
  A.classList.add('rolling'); Bd.classList.add('rolling');
  return delays.reduce(function(chain,ms){
    return chain.then(function(){
      drawDie('dieA',1+Math.floor(Math.random()*6));
      drawDie('dieB',1+Math.floor(Math.random()*6));
      Sfx.play('dice');
      return sleep(ms);
    });
  }, Promise.resolve()).then(function(){
    A.classList.remove('rolling'); Bd.classList.remove('rolling');
    drawDie('dieA',roll.a); drawDie('dieB',roll.b);
    Sfx.play('settle');
    A.classList.add('settle'); Bd.classList.add('settle');
    setTimeout(function(){ A.classList.remove('settle'); Bd.classList.remove('settle') },400);
    return sleep(160);
  });
}
