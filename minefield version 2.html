<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สนามทุ่นระเบิด</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#2A1B0E; --paper-2:#43301B; --paper-3:#523B21;
  --ink:#F2E7D2; --ink-2:#C6B08B; --ink-3:#9A8460;
  --rule:#6D5130; --hazard:#D8A72B; --blood:#D9503F; --heal:#78C97C; --cache:#5C4620;
  --brass:#D8A72B; --brass-dark:#8A6512; --wood:#5A3E22; --wood-dark:#1F1409;
  --sans:'IBM Plex Sans Thai',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink); background-color:var(--paper);
  background-image:
    repeating-linear-gradient(93deg,rgba(255,255,255,.022) 0 2px,transparent 2px 7px),
    repeating-linear-gradient(89deg,rgba(0,0,0,.16) 0 1px,transparent 1px 23px),
    linear-gradient(160deg,#33210F 0%,#241708 60%,#2E1D0D 100%);
  padding:20px 16px 48px; line-height:1.6;
}
.app{max-width:1120px;margin:0 auto}

header{border-bottom:2px solid var(--brass-dark);padding-bottom:10px;margin-bottom:22px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:.22em;margin:0;text-transform:uppercase}
.tagline{font-size:14px;color:var(--ink-2)}
.meta{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase;margin-top:4px}
.langs{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;flex:none}
.langs button{font-family:var(--mono);font-size:11px;letter-spacing:.12em;padding:6px 11px;border:0;border-radius:0;
  border-left:1px solid var(--rule);background:#3B2913;color:var(--ink-2);cursor:pointer}
.langs button:first-child{border-left:0}
.langs button[aria-pressed="true"]{background:linear-gradient(180deg,#E4B63C,#B7871A);color:#2A1B0E}

.card{background:var(--paper-2);border:1px solid var(--rule);border-radius:6px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 2px 0 rgba(0,0,0,.35);
  background-image:repeating-linear-gradient(91deg,rgba(255,255,255,.018) 0 2px,transparent 2px 8px)}
.card h2{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  margin:0;padding:9px 14px;border-bottom:1px solid var(--rule);color:var(--ink-2)}

.setup{max-width:540px;margin:8px auto}
.setup .body{padding:20px}
.setup p{margin:0 0 16px;color:var(--ink-2);font-size:15px}
.choices{display:flex;gap:8px;margin-bottom:20px}
.choice{flex:1;padding:12px 4px;background:linear-gradient(180deg,#4C3618,#33230F);border:1px solid var(--rule);border-radius:4px;
  cursor:pointer;text-align:center;font-family:var(--mono);font-size:19px;font-weight:600;color:var(--ink);line-height:1.2}
.choice[aria-pressed="true"]{background:linear-gradient(180deg,#E4B63C,#B7871A);color:#2A1B0E;border-color:var(--brass-dark)}
.opts{display:grid;gap:8px;margin-bottom:18px}
.opt{display:flex;align-items:center;gap:10px;padding:7px 12px;background:#33230F;border:1px solid var(--rule);border-radius:4px}
.opt span{flex:1;font-size:13px;color:var(--ink-2)}
.step{display:flex;align-items:stretch;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:#3B2913}
.step button{border:0;border-radius:0;padding:3px 12px;font-family:var(--mono);font-size:16px;background:transparent;color:var(--ink)}
.step button:disabled{opacity:.3}
.step b{font-family:var(--mono);font-size:14px;min-width:32px;text-align:center;padding:4px 0;
  border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
.fieldlbl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-2);margin-bottom:7px}
.adv{border:1px solid var(--rule);border-radius:4px;background:#33230F;margin-bottom:18px}
.adv summary{cursor:pointer;padding:9px 13px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-2);list-style:none;display:flex;justify-content:space-between;align-items:center}
.adv summary::-webkit-details-marker{display:none}
.adv summary::after{content:'+';font-size:15px;line-height:1}
.adv[open] summary::after{content:'\2212'}
.adv .advbody{padding:2px 13px 6px}
.adv .opts{margin-bottom:6px}
.proster{display:grid;gap:7px;margin-bottom:18px}
.prow{display:flex;align-items:center;gap:9px}
.pname{flex:1;min-width:0;font-family:var(--sans);font-size:13px;padding:7px 10px;color:var(--ink);
  background:#2E1F0E;border:1px solid var(--rule);border-radius:4px}
.pname:focus-visible{outline:2px solid var(--hazard);outline-offset:1px}
.seg{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;flex:none}
.seg button{border:0;border-radius:0;padding:6px 12px;font-size:12px;background:#3B2913;
  color:var(--ink-2);border-left:1px solid var(--rule)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,#E4B63C,#B7871A);color:#2A1B0E}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;padding:1px 5px;margin-left:2px;
  border:1px solid var(--rule);border-radius:2px;color:var(--ink-3)}
.rules{font-size:13px;color:var(--ink-2);border-top:1px dashed var(--rule);padding-top:14px}
.rules b{font-weight:600;color:var(--ink)}
.rules div{margin-bottom:5px}

.game{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
@media(max-width:880px){.game{grid-template-columns:1fr}}

.stage{position:relative;padding:14px;display:flex;justify-content:center;
  background:radial-gradient(ellipse at 38% 28%,#6B4A28 0%,#4A3218 55%,#33220F 100%);
  background-image:radial-gradient(ellipse at 38% 28%,#6B4A28 0%,#4A3218 55%,#33220F 100%),
    repeating-linear-gradient(88deg,rgba(0,0,0,.13) 0 1px,transparent 1px 19px);
  border-bottom:1px solid var(--rule)}
svg#board{width:100%;height:auto;max-width:560px;display:block}
.tile{fill:#523A1E;stroke:#8A6B41;stroke-width:1}
.tile.start{stroke-width:2.5}
.tile.cache{fill:#6A5322;stroke:var(--brass);stroke-dasharray:3 2.5}
.basebox{fill:none;stroke-width:1.6;stroke-dasharray:3.5 2.5;opacity:.9}
.cglyph{font-family:var(--mono);font-weight:600;fill:var(--brass);text-anchor:middle;dominant-baseline:central}
.tnum{font-family:var(--mono);fill:var(--ink-3);text-anchor:middle;dominant-baseline:central}
.slabel{font-family:var(--mono);font-size:10px;letter-spacing:.04em;dominant-baseline:central}
.guide{fill:none;stroke:#8A6B41;stroke-width:1;stroke-dasharray:2 6;opacity:.5}
.platform{fill:#6B4E2A;stroke:#8A6B41;stroke-width:1;opacity:.85}
.tie line{stroke:#7A5A32;stroke-width:2.4;opacity:.75}
.rail{fill:none;stroke:#9AA3AB;stroke-width:1.8;opacity:.85}
.token{stroke:#1F1409;stroke-width:1.5}
.sheen{fill:#fff;opacity:.3;pointer-events:none}
.token.moving{stroke-width:2.5}
.shadow{fill:var(--ink);opacity:.16}
.tletter{font-family:var(--mono);font-size:11px;font-weight:600;fill:#1F1409;text-anchor:middle;dominant-baseline:central}
.mine{stroke:var(--brass);stroke-width:1.8}
.mlabel{font-family:var(--mono);font-weight:600;fill:#1F1409;text-anchor:middle;dominant-baseline:central}
.blast{animation:blast .7s ease-out}
@keyframes blast{0%{fill:var(--blood)}60%{fill:var(--hazard)}100%{fill:var(--paper)}}
@media(prefers-reduced-motion:reduce){.blast{animation:none}}

.console{padding:14px;border-top:1px solid var(--rule);margin-top:10px}
.readout{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.die{width:48px;height:48px;flex:none;background:linear-gradient(160deg,#F0E6D2,#C9B896);border:1.5px solid #1F1409;border-radius:8px;box-shadow:0 2px 0 rgba(0,0,0,.4);
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:7px;gap:2px}
.die i{border-radius:50%;background:transparent}
.die i.on{background:#1F1409}
.dice{display:flex;gap:8px;flex:none}
.hudslot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
.hud{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}
/* แบบรถไฟกลางกระดานมีช่องอยู่ ลูกเต๋าจึงย้ายลงมาอยู่แถวเดียวกับสถานะแทน */
.hud.bar{flex-direction:row;align-items:center;gap:12px;text-align:left}
.hud.bar .hudname{max-width:170px}
.hudname{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--ink-2);
  max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hudhp{font-size:14px}
.floater{font-family:var(--mono);font-weight:600;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.die{transition:box-shadow .2s}
.die.rolling{animation:tumble .3s linear infinite}
@keyframes tumble{
  0%{transform:rotate(0) scale(1) translateY(0)}
  25%{transform:rotate(-15deg) scale(1.07) translateY(-4px)}
  50%{transform:rotate(7deg) scale(.95) translateY(3px)}
  75%{transform:rotate(16deg) scale(1.05) translateY(-2px)}
  100%{transform:rotate(0) scale(1) translateY(0)}
}
.die.settle{animation:settle .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes settle{0%{transform:scale(1.24)}55%{transform:scale(.95)}100%{transform:scale(1)}}
.stage.shake{animation:bshake .42s ease-out}
@keyframes bshake{
  0%,100%{transform:translate(0,0)}
  15%{transform:translate(-5px,2px)}35%{transform:translate(4px,-3px)}
  55%{transform:translate(-3px,-1px)}75%{transform:translate(2px,2px)}
}
@media(prefers-reduced-motion:reduce){
  .die.rolling,.die.settle,.stage.shake{animation:none}
}
.status{flex:1;min-width:200px;font-size:14px}
.status b{font-weight:600}
.status .why{display:block;font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.stepbtn{font-family:var(--mono);font-size:16px;font-weight:600;padding:7px 14px;min-width:42px}
#btnReset{margin-left:auto;font-size:13px;padding:7px 14px;border-color:var(--rule);color:var(--ink-2)}
#btnReset:hover{border-color:var(--ink);color:var(--ink)}
.stepbtn.danger{border-color:var(--blood);color:var(--blood);border-width:2px}
.stepbtn.danger2{background:var(--blood);color:#1F1409;border-color:var(--blood)}
.pick{fill:none;stroke-width:2.5;animation:pickpulse 1.4s ease-in-out infinite}
@keyframes pickpulse{0%,100%{opacity:1}50%{opacity:.4}}
.badge{stroke:var(--paper-2);stroke-width:1.5}
.btxt{font-family:var(--mono);font-size:11px;font-weight:600;fill:var(--paper-2);text-anchor:middle;dominant-baseline:central}
.hit{cursor:pointer}
@media(prefers-reduced-motion:reduce){.pick{animation:none}}
button{font-family:var(--sans);font-size:14px;font-weight:500;padding:9px 18px;border-radius:4px;cursor:pointer;
  border:1px solid var(--rule);color:var(--ink);
  background:linear-gradient(180deg,#5B411F,#3B2913);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
button:hover{border-color:var(--brass)}
button.primary{background:linear-gradient(180deg,#E4B63C,#B7871A);border-color:var(--brass-dark);color:#2A1B0E}
button.hazard{background:linear-gradient(180deg,#E4B63C,#B7871A);border-color:var(--brass-dark);color:#2A1B0E}
button:disabled{opacity:.34;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--hazard);outline-offset:2px}

.units{padding:6px 0}
.unit{display:flex;align-items:center;gap:9px;padding:9px 14px;border-bottom:1px dashed var(--rule)}
.unit:last-child{border-bottom:0}
.unit.turn{background:rgba(216,167,43,.12)}
.chip{width:19px;height:19px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.45);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10px;font-weight:600;color:var(--paper-2)}
.uname{font-size:13px;font-weight:500;flex:1;min-width:0}
.uname em{font-family:var(--mono);font-style:normal;font-size:10px;color:var(--ink-3);letter-spacing:.06em;display:block}
.pips{font-family:var(--mono);font-size:13px;letter-spacing:1px;white-space:nowrap}
.pips i{font-style:normal}
.pips i.off{opacity:.22}
.pips.hp{color:var(--blood);font-size:12px;letter-spacing:.5px}
.pips.mn{color:var(--ink-2);font-size:12px;display:inline-flex;align-items:center;gap:1px}
.mglyph{vertical-align:-2px}
.mglyph.off{opacity:.22}
.mx{font-family:var(--mono);font-size:12px;margin-left:2px}
.nm{display:flex;align-items:center;gap:7px}
.unit.out{opacity:.45}
.unit.out .uname{text-decoration:line-through}

.log{list-style:none;margin:0;padding:6px 0;max-height:280px;overflow-y:auto}
.log li{font-size:12.5px;padding:5px 14px;border-bottom:1px dashed var(--rule);display:flex;gap:9px}
.log li:last-child{border-bottom:0}
.log .t{font-family:var(--mono);font-size:10px;color:var(--ink-3);flex:none;padding-top:2px}
.log .k-boom{background:rgba(217,80,63,.14);color:var(--blood);font-weight:500}
.log .k-heal{color:var(--heal)}
.log .k-mine{color:var(--brass)}
.log .k-out{background:rgba(0,0,0,.25);font-weight:600}
.log .k-win{background:linear-gradient(180deg,#E4B63C,#B7871A);color:#2A1B0E;font-weight:600}
.log .k-restock{color:var(--brass);font-weight:500}

.over{position:absolute;inset:14px;display:flex;align-items:center;justify-content:center;
  background:rgba(31,20,9,.82);border-radius:4px}
.over div{text-align:center;border:2px solid var(--brass);background:linear-gradient(180deg,#59401F,#3A2712);
  padding:22px 30px;border-radius:6px;transform:rotate(-2deg);box-shadow:0 6px 0 rgba(0,0,0,.4)}
.over h3{font-family:var(--mono);margin:0 0 4px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2)}
.over p{margin:0 0 16px;font-size:21px;font-weight:600}
.hidden{display:none !important}
footer{margin-top:20px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <div>
        <div class="brand">
          <h1>Minefield</h1>
          <span class="tagline" id="tagline"></span>
        </div>
        <div class="meta" id="meta"></div>
      </div>
      <div style="display:flex;gap:8px;align-items:flex-start">
        <div class="langs" id="langs"></div>
        <div class="langs"><button id="btnSound" type="button"></button></div>
      </div>
    </div>
  </header>

  <section class="card setup" id="setup">
    <h2 id="setupTitle"></h2>
    <div class="body">
      <p id="setupIntro"></p>
      <div class="fieldlbl" id="lblPlayers"></div>
      <div class="choices" id="choices"></div>
      <div class="proster" id="proster"></div>
      <div class="opts" id="shaperow"></div>
      <div class="opts" id="botrow"></div>
      <details class="adv"><summary id="advTitle"></summary>
        <div class="advbody"><div class="opts" id="opts"></div></div>
      </details>
      <div class="rules" id="rules"></div>
      <div class="actions"><button class="primary" id="btnStart"></button></div>
    </div>
  </section>

  <section class="game hidden" id="game">
    <div class="card">
      <h2 id="boardTitle"></h2>
      <div class="stage">
        <svg id="board" role="img"></svg>
        <div class="hudslot" id="hudBoard">
          <div class="hud" id="hud" aria-hidden="true">
            <div class="dice"><div class="die" id="dieA"></div><div class="die" id="dieB"></div></div>
            <div class="hudname" id="hudName"></div>
            <div class="hudhp pips hp" id="hudHp"></div>
          </div>
        </div>
        <div class="over hidden" id="over">
          <div>
            <h3 id="overKicker"></h3>
            <p id="overText"></p>
            <button class="primary" id="btnAgain"></button>
          </div>
        </div>
      </div>
      <div class="console">
        <div class="readout">
          <div id="hudBar"></div>
          <div class="status" id="status" aria-live="polite"></div>
        </div>
        <div class="actions">
          <button class="primary" id="btnRoll"></button>
          <div class="steps" id="steps"></div>
          <button class="hazard hidden" id="btnPlace"></button>
          <button class="hidden" id="btnSkip"></button>
          <button id="btnReset"></button>
        </div>
      </div>
    </div>

    <div>
      <div class="card" style="margin-bottom:18px">
        <h2 id="unitsTitle"></h2>
        <div class="units" id="units"></div>
      </div>
      <div class="card">
        <h2 id="logTitle"></h2>
        <ul class="log" id="log"></ul>
      </div>
    </div>
  </section>

  <footer id="footer"></footer>
</div>

<script>
/* สนามทุ่นระเบิด - รูปทรงบอร์ด
   ทุกรูปทรงถูกแทนด้วยแนวคิดเดียวกัน: เส้นทางปิดหนึ่งเส้น แล้ววางช่องตามระยะทางบนเส้นให้เท่ากัน
   คณิตศาสตร์ล้วน ไม่แตะ DOM และไม่ใช้ getPointAtLength ของเบราว์เซอร์ จึงเทสต์ใน node ได้ */
(function (root) {
  'use strict';

  var TAU = Math.PI * 2;
  var ROW_GAP = 3.6;    /* ระยะห่างแถวขั้นต่ำ คิดเป็นกี่เท่าของรัศมีช่อง */
  var MIN_CLEAR = 2.4;  /* ช่องที่ไม่ได้ติดกันตามลำดับต้องห่างกันอย่างน้อยกี่เท่าของรัศมี */

  /* ---------- เส้นทางประกอบจากท่อนตรงและท่อนโค้ง ---------- */

  function line(ax, ay, bx, by) {
    return { t: 'line', ax: ax, ay: ay, bx: bx, by: by,
             len: Math.hypot(bx - ax, by - ay) };
  }
  function arc(cx, cy, r, a0, a1) {
    return { t: 'arc', cx: cx, cy: cy, r: r, a0: a0, a1: a1,
             len: r * Math.abs(a1 - a0) };
  }
  function total(segs) {
    return segs.reduce(function (s, x) { return s + x.len; }, 0);
  }

  /* คืนพิกัดและเวกเตอร์ทิศทางที่ระยะทาง t บนเส้นทาง */
  function pointAt(segs, P, t) {
    var d = ((t % P) + P) % P;
    for (var i = 0; i < segs.length; i++) {
      var s = segs[i];
      if (d <= s.len || i === segs.length - 1) {
        if (s.t === 'line') {
          var u = s.len ? d / s.len : 0;
          var tx = (s.bx - s.ax) / (s.len || 1), ty = (s.by - s.ay) / (s.len || 1);
          return { x: s.ax + (s.bx - s.ax) * u, y: s.ay + (s.by - s.ay) * u, tx: tx, ty: ty };
        }
        var dir = s.a1 >= s.a0 ? 1 : -1;
        var a = s.a0 + (s.a1 - s.a0) * (s.len ? d / s.len : 0);
        return {
          x: s.cx + s.r * Math.cos(a), y: s.cy + s.r * Math.sin(a),
          tx: -Math.sin(a) * dir, ty: Math.cos(a) * dir
        };
      }
      d -= s.len;
    }
    return { x: 0, y: 0, tx: 1, ty: 0 };
  }

  /* ---------- รูปทรงแต่ละแบบ ---------- */

  function ringSegs(W, H) {
    var R = Math.min(W, H) / 2;
    return [arc(W / 2, H / 2, R, -Math.PI / 2, -Math.PI / 2 + TAU)];
  }

  /* n เหลี่ยมปกติ มุมคม ด้านเท่ากันทุกด้าน

/* ---------- geometry ---------- */
/* กรอบบนจอโตตามจำนวนช่อง ไม่งั้นบอร์ด 90 ช่องจะเล็กจนอ่านไม่ออก
   ส่วนรูปทรงจริงคำนวณโดยโมดูล Geom ซึ่งคืนพิกัดทุกช่องพร้อมเวกเตอร์ตั้งฉาก */
function geometry(){
  var size=S.boardSize;
  var maxW=Math.max(520,Math.min(780,Math.round(480+size*3)));
  var boxW=1000, boxH=Math.round(boxW*(S.rules.shape==='snake'?0.62:0.78));
  var L=Geom.layout({shape:S.rules.shape, sides:S.players.length, tiles:size,
                     W:boxW, H:boxH, maxTile:34,
                     flip:S.rules.flip});
  return {L:L, tileR:L.tileR, boxW:boxW, boxH:boxH, maxW:maxW,
          cx:boxW/2, cy:boxH/2};
}

/* i เป็นทศนิยมได้ เพราะการเดินทีละช่องใช้ตำแหน่งระหว่างช่อง
   off คือระยะเลื่อนไปตามเวกเตอร์ตั้งฉาก ใช้ยกหมุดตอนกระโดดและวางป้ายฐาน */
function xy(i,off){
  var pts=geo.L.pts, n=pts.length;
  var f=((i%n)+n)%n, i0=Math.floor(f), u=f-i0;
  var a=pts[i0], b=pts[(i0+1)%n];
  var x=a.x+(b.x-a.x)*u, y=a.y+(b.y-a.y)*u;
  if(off){
    var nx=a.nx+(b.nx-a.nx)*u, ny=a.ny+(b.ny-a.ny)*u;
    var m=Math.hypot(nx,ny)||1;
    /* บนแบบรถไฟแถวคู่กับแถวคี่หันตั้งฉากคนละทาง บังคับให้ยกขึ้นเสมอจะอ่านง่ายกว่า */
    if(S.rules.shape==='snake'&&ny>0){ nx=-nx; ny=-ny; }
    x+=nx/m*off; y+=ny/m*off;
  }
  return {x:x,y:y};
}
function el(tag,attrs){
  var e=document.createElementNS('http://www.w3.org/2000/svg',tag);
  for(var k in attrs) e.setAttribute(k,attrs[k]);
  return e;
}

/* ---------- board ---------- */
/* วาดพื้นราง: แบบรถไฟได้รางจริงพร้อมหมอนรองและชานชาลาเกาะกลาง
   แบบอื่นได้เส้นนำสายตาจาง ๆ เหมือนเดิม */
function drawTrack(svg){
  var L=geo.L, g=el('g',{'class':'track'});

  if(S.rules.shape==='snake'){
    /* ชานชาลาเกาะกลางใต้แถวตรง ช่องจะดูเหมือนวางอยู่บนชานชาลาสถานี */
    (L.rows||[]).forEach(function(r){
      var pad=geo.tileR*1.35;
      g.appendChild(el('rect',{x:Math.min(r.x1,r.x2)-pad,y:r.y-geo.tileR*1.15,
        width:Math.abs(r.x2-r.x1)+pad*2,height:geo.tileR*2.3,rx:geo.tileR*1.15,
        'class':'platform'}));
    });

    /* หมอนรองวางตั้งฉากกับรางทุก ๆ ระยะ */
    var ties=el('g',{'class':'tie'});
    L.samples.forEach(function(p,i){
      if(i%3) return;
      var w=geo.tileR*0.95;
      ties.appendChild(el('line',{x1:p.x+p.nx*w,y1:p.y+p.ny*w,
                                  x2:p.x-p.nx*w,y2:p.y-p.ny*w}));
    });
    g.appendChild(ties);

    /* รางสองเส้นขนาบ */
    [1,-1].forEach(function(sgn){
      var d='', off=geo.tileR*0.5;
      L.samples.forEach(function(p,i){
        d+=(i?'L':'M')+(p.x+p.nx*off*sgn).toFixed(1)+' '+(p.y+p.ny*off*sgn).toFixed(1);
      });
      g.appendChild(el('path',{d:d+'Z','class':'rail'}));
    });
  } else {
    var d='';
    L.pts.forEach(function(p,i){ d+=(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1); });
    g.appendChild(el('path',{d:d+'Z','class':'guide'}));
  }
  svg.appendChild(g);
}

function buildBoard(){
  /* กลางกระดานว่างเฉพาะแบบวงกลมกับ n เหลี่ยม แบบรถไฟมีช่องอยู่ตรงนั้น ต้องย้ายลูกเต๋าออกมา */
  var onBoard=(S.rules.shape!=='snake');
  (onBoard?$('hudBoard'):$('hudBar')).appendChild($('hud'));
  $('hud').classList.toggle('bar',!onBoard);

  var svg=$('board');
  svg.setAttribute('viewBox','0 0 '+geo.boxW+' '+geo.boxH);
  svg.style.maxWidth=geo.maxW+'px';
  svg.innerHTML='';
  drawTrack(svg);
  var tiles=el('g',{});
  var pending=[];
  for(var i=0;i<S.boardSize;i++){
    var p=xy(i);
    var owner=S.startTiles.indexOf(i);
    var cls='tile'+(owner>=0?' start':'')+(S.caches[i]?' cache':'');
    var c=el('circle',{cx:p.x,cy:p.y,r:geo.tileR,'class':cls,id:'tile'+i});
    if(owner>=0) c.setAttribute('stroke',S.players[owner].color);
    tiles.appendChild(c);
    if(owner>=0||geo.tileR>=13||i%6===0){
      var tx=el('text',{x:p.x,y:p.y,'class':'tnum','font-size':Math.max(7,Math.min(11,Math.round(geo.tileR*0.7)))});
      tx.textContent=i; tiles.appendChild(tx);
    }
    if(owner>=0){
      var col=S.players[owner].color;
      /* กรอบสี่เหลี่ยมเส้นประครอบช่องฐาน เพราะวงกลมเส้นหนาอย่างเดียวยังกลืนไปกับช่องอื่น */
      var box=geo.tileR+5;
      tiles.appendChild(el('rect',{x:p.x-box,y:p.y-box,width:box*2,height:box*2,rx:3,
        'class':'basebox',stroke:col}));
      /* รูปบ้านแล้วตามด้วยชื่อผู้เล่น จัดกึ่งกลางทีหลังเพราะต้องวัดความกว้างข้อความจริงก่อน */
      var grp=el('g',{});
      grp.appendChild(el('path',{d:'M0 -0.5 L4.5 -5 L9 -0.5 L9 3.5 L0 3.5 Z',fill:col}));
      var nm=el('text',{x:13,y:0,'class':'slabel',fill:col});
      nm.textContent=uname(owner);
      grp.appendChild(nm);
      tiles.appendChild(grp);
      pending.push({grp:grp,txt:nm,lp:xy(i,geo.tileR+15)});
    }
  }
  svg.appendChild(tiles);
  pending.forEach(function(o){
    var w=0;
    try { w=o.txt.getComputedTextLength(); } catch(e) { w=uname(0).length*5.5; }
    o.grp.setAttribute('transform','translate('+(o.lp.x-(13+w)/2)+','+o.lp.y+')');
  });
  svg.appendChild(el('g',{id:'caches'}));
  svg.appendChild(el('g',{id:'mines'}));
  svg.appendChild(el('g',{id:'tokens'}));
  svg.appendChild(el('g',{id:'picks'}));
  svg.appendChild(el('g',{id:'fx'}));
}

/* เครื่องหมายจุดเก็บทุ่นโผล่เฉพาะตอนช่องนั้นยังไม่มีทุ่นทับ เพราะทุ่นบังตรงกลางพอดี */
function drawCaches(){
  var g=$('caches'); g.innerHTML='';
  Object.keys(S.caches).forEach(function(k){
    if(S.mines[k]) return;
    var p=xy(+k);
    var tx=el('text',{x:p.x,y:p.y,'class':'cglyph','font-size':Math.max(8,Math.round(geo.tileR*0.85))});
    tx.textContent='+';
    g.appendChild(tx);
  });
}

/* ทุ่นระเบิดทะเล: ตัวกลมพร้อมหนาม จำนวนหนามบอกจำนวนทุ่นในช่อง
   ทุ่นเดียว 4 ทิศ กองซ้อน 8 ทิศ อ่านความอันตรายได้จากรูปทรงโดยไม่ต้องนับ */
function drawMineIcon(g,cx,cy,R,color,spikeCount){
  var n=spikeCount||4;
  var spikes=el('g',{stroke:color,'stroke-width':Math.max(1.2,R*(n>4?0.22:0.26)),'stroke-linecap':'round'});
  for(var i=0;i<n;i++){
    var a=-Math.PI/2 + i*(Math.PI*2/n);
    spikes.appendChild(el('line',{
      x1:cx+Math.cos(a)*R*0.52, y1:cy+Math.sin(a)*R*0.52,
      x2:cx+Math.cos(a)*R,      y2:cy+Math.sin(a)*R}));
  }
  g.appendChild(spikes);
  g.appendChild(el('circle',{cx:cx,cy:cy,r:R*0.62,'class':'mine',fill:color}));
  g.appendChild(el('ellipse',{cx:cx-R*0.2,cy:cy-R*0.27,rx:R*0.26,ry:R*0.16,'class':'sheen'}));
}

function drawMines(){
  var g=$('mines'); g.innerHTML='';
  Object.keys(S.mines).forEach(function(k){
    var p=xy(+k), owner=S.players[S.mines[k].ownerId], R=geo.tileR*0.88;
    var stacked=(S.mines[k].count||1)>1;
    drawMineIcon(g,p.x,p.y,stacked?R*1.06:R,owner.color,stacked?8:4);
    var fs=Math.max(7,Math.round(R*0.66));
    if(fs<=R*1.24){
      var lb=el('text',{x:p.x,y:p.y,'class':'mlabel','font-size':fs});
      lb.textContent=owner.letter;
      g.appendChild(lb);
    }
  });
}

function drawTokens(){
  var g=$('tokens'); g.innerHTML='';
  var byTile={};
  S.players.forEach(function(p){
    if(p.hp<=0) return;
    if(animTok&&animTok.id===p.id) return;   /* คนที่กำลังเดิน วาดแยกทีหลังให้อยู่ชั้นบนสุด */
    (byTile[p.pos]=byTile[p.pos]||[]).push(p);
  });
  Object.keys(byTile).forEach(function(k){
    var c=xy(+k), list=byTile[k], mined=!!S.mines[k];
    var r=Math.max(6,geo.tileR*0.46), spread=(list.length>1||mined);
    list.forEach(function(p,n){
      var x=c.x,y=c.y;
      if(spread){
        var a=(n/list.length)*Math.PI*2-Math.PI/2, off=geo.tileR*(mined?1.0:0.5);
        x+=off*Math.cos(a); y+=off*Math.sin(a);
      }
      g.appendChild(el('circle',{cx:x,cy:y,r:r,'class':'token',fill:p.color}));
      g.appendChild(el('ellipse',{cx:x-r*0.22,cy:y-r*0.34,rx:r*0.46,ry:r*0.28,'class':'sheen'}));
      if(geo.tileR>=16&&!spread){
        var tl=el('text',{x:x,y:y,'class':'tletter'}); tl.textContent=p.letter; g.appendChild(tl);
      }
    });
  });

  if(animTok){
    var mv=S.players[animTok.id];
    var base=xy(animTok.idx);
    var air=xy(animTok.idx,animTok.lift);
    var r=Math.max(6,geo.tileR*0.46);
    /* เงาอยู่กับพื้นวง ตัวหมุดลอยขึ้น ทำให้อ่านออกว่ากำลังกระโดดข้ามช่อง */
    g.appendChild(el('ellipse',{cx:base.x,cy:base.y,rx:r*0.8,ry:r*0.55,'class':'shadow'}));
    g.appendChild(el('circle',{cx:air.x,cy:air.y,r:r*(1+animTok.lift/(geo.tileR*4)),'class':'token moving',fill:mv.color}));
    if(geo.tileR>=16){
      var ml=el('text',{x:air.x,y:air.y,'class':'tletter'}); ml.textContent=mv.letter; g.appendChild(ml);
    }
  }
}

/* วงกระเพื่อมสำหรับเน้นเหตุการณ์บนช่อง วาดด้วย rAF เพราะ CSS animate r ไม่ได้ทุกเบราว์เซอร์ */
function pulseAt(tile,color,scale){
  var layer=$('fx'); if(!layer) return;
  var p=xy(tile);
  var c=el('circle',{cx:p.x,cy:p.y,r:geo.tileR*0.6,fill:'none',stroke:color,'stroke-width':2.5});
  layer.appendChild(c);
  var t0=null, dur=440, grow=geo.tileR*(scale||1.5);
  function frame(ts){
    if(t0===null) t0=ts;
    var k=Math.min(1,(ts-t0)/dur);
    c.setAttribute('r',geo.tileR*0.6+grow*k);
    c.setAttribute('opacity',(1-k)*0.75);
    if(k<1) requestAnimationFrame(frame); else if(c.parentNode) c.parentNode.removeChild(c);
  }
  requestAnimationFrame(frame);
}

/* ตัวเลขลอยขึ้นจากช่อง บอกทันทีว่าได้หรือเสียอะไรไปเท่าไร */
function floatText(tile,text,color){
  var layer=$('fx'); if(!layer) return;
  var p=xy(tile);
  var t=el('text',{x:p.x,y:p.y,'class':'floater',fill:color,
    'font-size':Math.max(11,Math.round(geo.tileR*0.95))});
  t.textContent=text;
  layer.appendChild(t);
  var t0=null, dur=900;
  function frame(ts){
    if(t0===null) t0=ts;
    var k=Math.min(1,(ts-t0)/dur);
    t.setAttribute('y',p.y-geo.tileR*1.6*k);
    t.setAttribute('opacity', k<0.15 ? k/0.15 : 1-(k-0.15)/0.85);
    if(k<1) requestAnimationFrame(frame); else if(t.parentNode) t.parentNode.removeChild(t);
  }
  requestAnimationFrame(frame);
}

function blastAt(tile){
  var t=$('tile'+tile);
  if(t){ t.classList.add('blast'); setTimeout(function(){t.classList.remove('blast')},700); }
  pulseAt(tile,'#9E2B24',2.2);
  setTimeout(function(){ pulseAt(tile,'#9E2B24',1.6) },120);
  var st=document.querySelector('.stage');
  st.classList.add('shake'); setTimeout(function(){st.classList.remove('shake')},430);
}

/* เดินทีละช่องด้วย ease-in-out ต่อช่อง ได้จังหวะกระโดดแบบหมากกระดาน
   ตำแหน่งเป็นเลขทศนิยม ส่งเข้า xy() ตรง ๆ ได้เลยเพราะสูตรมุมรับค่าเศษส่วนอยู่แล้ว */
function animateMove(id,from,roll){
  return new Promise(function(done){
    var t0=null, per=185, total=roll*per, lastStep=-1;
    function frame(ts){
      if(t0===null) t0=ts;
      var k=Math.min(1,(ts-t0)/total);
      var raw=k*roll;
      var i=Math.min(roll-1,Math.floor(raw));
      var f=raw-i;
      var eased=f<0.5 ? 2*f*f : 1-Math.pow(-2*f+2,2)/2;
      if(i!==lastStep){ lastStep=i; Sfx.play('step',i); }
      animTok={id:id, idx:from+i+eased, lift:Math.sin(Math.PI*f)*geo.tileR*0.6};
      drawTokens();
      if(k<1) requestAnimationFrame(frame);
      else { animTok=null; drawTokens(); done(); }
    }
    requestAnimationFrame(frame);
  });
}

/* เต๋าสองลูกทิ้งตัวพร้อมกัน หน้าสลับถี่แล้วค่อย ๆ ช้าลง ปิดท้ายด้วยจังหวะกระแทกลง */
/* แผนที่จาก log key ไปเสียง ใช้กลไก log-diff เดิมที่คำนวณอยู่แล้ว ไม่ต้องเดินสายใหม่ */
var SFX={boom:'blast', boomstack:'blast2', heal:'heal', supply:'pickup',
         place:'plant', stack:'plant2', forced:'alert', out:'death', win:'fanfare'};

function tumbleDice(roll){
  var A=$('dieA'), Bd=$('dieB');
  if(reduced){ drawDie('dieA',roll.a); drawDie('dieB',roll.b); return Promise.resolve() }
  var delays=[40,44,52,64,80,100,126,158,196];
  A.classList.add('rolling'); Bd.classList.add('rolling');
  return delays.reduce(function(chain,ms){
    return chain.then(function(){
      drawDie('dieA',1+Math.floor(Math.random()*6));
      drawDie('dieB',1+Math.floor(Math.random()*6));
      Sfx.play('dice');
      return sleep(ms);
    });
  }, Promise.resolve()).then(function(){
    A.classList.remove('rolling'); Bd.classList.remove('rolling');
    drawDie('dieA',roll.a); drawDie('dieB',roll.b);
    Sfx.play('settle');
    A.classList.add('settle'); Bd.classList.add('settle');
    setTimeout(function(){ A.classList.remove('settle'); Bd.classList.remove('settle') },400);
    return sleep(160);
  });
}

/* ---------- panels ---------- */
function drawDie(id,v){
  var d=$(id); d.innerHTML='';
  var on=v?PIPS[v]:[];
  for(var i=0;i<9;i++){
    var s=document.createElement('i');
    if(on.indexOf(i)>=0) s.className='on';
    d.appendChild(s);
  }
}
/* หัวใจสำหรับ HP และข้าวหลามตัดสำหรับทุ่น ให้ตรงกับสัญลักษณ์ทุ่นบนบอร์ด */
function hpPips(hp){
  var s='', max=(S&&S.rules)?S.rules.hpMax:Game.C.HP_START+1;
  for(var i=0;i<max;i++) s+='<i class="'+(i<hp?'on':'off')+'">\u2665</i>';
  return s;
}
/* ไอคอนทุ่นระเบิดแบบเดียวกับบนบอร์ด ย่อลงมาใช้ในแผงหน่วย */
function mineGlyph(color,dim){
  var sp='';
  for(var i=0;i<4;i++){
    var a=-Math.PI/2 + i*Math.PI/2;
    sp+='<line x1="'+(Math.cos(a)*5).toFixed(1)+'" y1="'+(Math.sin(a)*5).toFixed(1)+
        '" x2="'+(Math.cos(a)*9).toFixed(1)+'" y2="'+(Math.sin(a)*9).toFixed(1)+'"/>';
  }
  return '<svg class="mglyph'+(dim?' off':'')+'" viewBox="-10 -10 20 20" width="13" height="13" aria-hidden="true">'+
    '<g stroke="'+color+'" stroke-width="3" stroke-linecap="round">'+sp+'</g>'+
    '<circle r="5.8" fill="'+color+'"/></svg>';
}
function mineDisp(n,color){
  if(!n) return mineGlyph(color,true);
  if(n>8) return mineGlyph(color,false)+'<span class="mx">\u00D7'+n+'</span>';
  var s=''; for(var i=0;i<n;i++) s+=mineGlyph(color,false);
  return s;
}

/* ไฮไลต์ช่องปลายทางทุกช่องที่เลือกได้ พร้อมป้ายจำนวนก้าววางไว้ด้านในวง
   ทุ่นกับจุดเก็บยังมองเห็นตามปกติ ผู้เล่นจึงตัดสินใจได้จากข้อมูลครบ */
function drawPicks(){
  var g=$('picks'); if(!g) return;
  g.innerHTML='';
  if(!S||S.phase!=='AWAIT_MOVE') return;
  var me=S.players[S.currentIdx];
  if(me.bot) return;
  Game.moveOptions(S).forEach(function(o){
    var p=xy(o.tile);
    g.appendChild(el('circle',{cx:p.x,cy:p.y,r:geo.tileR+3.5,'class':'pick',stroke:me.color}));
    var b=xy(o.tile,-(geo.tileR+13));
    g.appendChild(el('circle',{cx:b.x,cy:b.y,r:9.5,'class':'badge',fill:me.color}));
    var tx=el('text',{x:b.x,y:b.y,'class':'btxt'}); tx.textContent=o.steps; g.appendChild(tx);
    var hit=el('circle',{cx:p.x,cy:p.y,r:geo.tileR+6,fill:'transparent','class':'hit'});
    hit.onclick=function(){ pickStep(o.steps) };
    g.appendChild(hit);
  });
}

function drawUnits(){
  var box=$('units'); box.innerHTML='';
  S.players.forEach(function(p,i){
    var alive=p.hp>0, turn=(i===S.currentIdx&&S.phase!=='GAME_OVER');
    var d=document.createElement('div');
    d.className='unit'+(alive?'':' out')+(turn&&alive?' turn':'');
    var sub=alive?(t('at_tile',{tile:p.pos})+(turn?' · '+t('active'):'')):t('knocked');
    d.innerHTML='<span class="chip" style="background:'+p.color+'">'+p.letter+'</span>'+
      '<span class="uname"><span class="nm">'+esc(uname(p.id))+
        '<span class="pips hp">'+hpPips(alive?p.hp:0)+'</span></span>'+
        '<em>'+sub+'</em></span>'+
      (alive?'<span class="pips mn">'+mineDisp(p.mines,p.color)+'</span>':'')+
      (p.bot?'<span class="tag">'+t('tag_bot')+'</span>':'');
    box.appendChild(d);
  });
}

function logText(e){
  var p=e.p, params={};
  for(var k in p) params[k]=p[k];
  if(p.p!==undefined) params.name=uname(p.p);
  if(p.owner!==undefined) params.owner=uname(p.owner);
  if(p.err) params.err=t(p.err);
  return t('log_'+e.key,params);
}
function drawLog(){
  var ul=$('log'); ul.innerHTML='';
  S.log.slice(0,60).forEach(function(e){
    var li=document.createElement('li');
    li.className='k-'+e.kind;
    li.innerHTML='<span class="t">'+String(e.turn).padStart(2,'0')+'</span><span></span>';
    li.lastChild.textContent=logText(e);
    ul.appendChild(li);
  });
}

function sync(){
  drawCaches(); drawMines(); drawTokens(); drawPicks(); drawUnits(); drawLog();
  var p=S.players[S.currentIdx], over=S.phase==='GAME_OVER', err=Game.placementError(S);
  var isBot=!over&&!!p.bot;
  $('meta').textContent=t('meta',{n:S.players.length,tiles:S.boardSize,turn:S.turnCount+1,mines:Object.keys(S.mines).length});

  var st=$('status');
  if(over){
    st.innerHTML='<b>'+t('st_over')+'</b>';
  } else if(isBot){
    st.innerHTML='<b>'+esc(t('st_thinking',{name:uname(p.id)}))+'</b>'+
      '<span class="why">'+t('st_sub',{hp:p.hp,mines:p.mines})+'</span>';
  } else if(S.phase==='AWAIT_MOVE'){
    var rg=Game.stepRange(S.lastRoll);
    st.innerHTML='<b>'+esc(t('st_move',{name:uname(p.id),lo:rg[0],hi:rg[1]}))+'</b>'+
      '<span class="why">'+t('st_move_sub')+'</span>';
  } else if(S.phase==='AWAIT_ROLL'){
    st.innerHTML='<b>'+esc(t('st_turn',{name:uname(p.id)}))+'</b><span class="why">'+t('st_sub',{hp:p.hp,mines:p.mines})+'</span>';
  } else {
    st.innerHTML= S.forced
      ? '<b>'+t('st_forced',{tile:p.pos})+'</b><span class="why">'+t('st_forced_sub')+'</span>'
      : '<b>'+t('st_ask',{tile:p.pos})+'</b><span class="why">'+(err?t(err):t('st_left',{mines:p.mines}))+'</span>';
  }

  $('btnRoll').disabled=!(!over&&S.phase==='AWAIT_ROLL'&&!busy&&!isBot);
  $('btnRoll').classList.toggle('hidden',S.phase!=='AWAIT_ROLL'||isBot);

  $('hudName').textContent = over ? t('st_over') : uname(p.id);
  $('hudHp').innerHTML = over ? '' : hpPips(p.hp);

  var sb=$('steps'); sb.innerHTML='';
  if(!over&&!isBot&&!busy&&S.phase==='AWAIT_MOVE'){
    Game.moveOptions(S).forEach(function(o){
      var b=document.createElement('button');
      b.type='button'; b.className='stepbtn'; b.textContent=o.steps;
      var m=S.mines[o.tile];
      if(m&&m.ownerId!==p.id){
        b.classList.add('danger');
        if((m.count||1)>1) b.classList.add('danger2');    /* กองซ้อน เสีย 2 หัวใจ */
      }
      b.onclick=function(){ pickStep(o.steps) };
      sb.appendChild(b);
    });
  }
  $('btnPlace').classList.toggle('hidden',S.phase!=='AWAIT_MINE'||isBot);
  $('btnPlace').disabled=!!err;
  $('btnSkip').classList.toggle('hidden',S.phase!=='AWAIT_MINE'||S.forced||isBot);

  if(over){
    $('over').classList.remove('hidden');
    $('overText').textContent = S.winner!==null ? t('over_win',{name:uname(S.winner)}) : t('over_none');
  }
}

/* ---------- actions ---------- */
function sleep(ms){ return new Promise(function(r){setTimeout(r,ms)}) }

async function doRoll(){
  var roll=Game.rollDice();
  await tumbleDice(roll);
  S=Game.applyRoll(S,roll);
  sync();
}

async function doMove(steps){
  var me=S.players[S.currentIdx], from=me.pos;
  if(!reduced) await animateMove(me.id,from,steps);

  var before=S.log.length;
  var next=Game.land(S,steps);
  var hit={};
  next.log.slice(0,next.log.length-before).forEach(function(e){ hit[e.key]=true });
  var where=next.players[me.id].pos;
  S=next; sync();

  Object.keys(hit).forEach(function(k){ if(SFX[k]) Sfx.play(SFX[k]) });
  if(!hit.boom&&!hit.boomstack) Sfx.play('land');

  if(!reduced){
    if(hit.boom||hit.boomstack){
      blastAt(where);
      floatText(where,'\u2212'+(hit.boomstack?2:1),'#D9503F');
      await sleep(hit.boomstack?680:560);
    } else {
      pulseAt(where, me.color);
      if(hit.heal){ pulseAt(where,'#78C97C',2); floatText(where,'+1','#78C97C'); }
      if(hit.supply){ pulseAt(where,'#D8A72B',2); floatText(where,'+1','#D8A72B'); }
      await sleep(180);
    }
  }
}

$('btnRoll').onclick=async function(){
  if(busy||!S||S.phase!=='AWAIT_ROLL'||S.players[S.currentIdx].bot) return;
  busy=true; sync();
  await doRoll();
  /* แต้มซ้ำไม่มีอะไรให้เลือก เดินให้เลย */
  if(S.forced){
    await sleep(reduced?60:400);
    await doMove(Game.stepChoices(S.lastRoll)[0]);
  }
  busy=false; sync();
  maybeBot();
};

function pickStep(steps){
  if(busy||!S||S.phase!=='AWAIT_MOVE'||S.players[S.currentIdx].bot) return;
  Sfx.play('click');
  busy=true; sync();
  doMove(steps).then(function(){ busy=false; sync(); maybeBot(); });
}

$('btnPlace').onclick=function(){ if(busy||!S) return; S=Game.placeMine(S); sync(); maybeBot(); };
$('btnSkip').onclick=function(){ if(busy||!S) return; S=Game.skipMine(S); sync(); maybeBot(); };

/* ลูกโซ่เทิร์นของคอมพิวเตอร์
   ทุกขั้นเทียบ runId กับตอนที่เริ่ม ถ้าผู้ใช้กดเริ่มใหม่ระหว่างทาง คิวที่ค้างอยู่จะหยุดเงียบ ๆ
   ไม่ไปแตะ state ของเกมรอบใหม่ */
function maybeBot(){
  if(!S||S.phase==='GAME_OVER'||!S.players[S.currentIdx].bot) return;
  var my=runId;
  setTimeout(function(){ botTurn(my) }, reduced?60:320);
}

async function botTurn(my){
  if(my!==runId||!S||S.phase!=='AWAIT_ROLL') return;
  var p=S.players[S.currentIdx];
  if(!p.bot) return;

  busy=true; sync();
  await sleep(reduced?80:420);
  if(my!==runId) return;

  await doRoll();
  if(my!==runId) return;

  if(S.phase==='AWAIT_MOVE'){
    await sleep(reduced?60:420);
    if(my!==runId) return;
    await doMove(Bot.chooseStep(S,p.bot));
    if(my!==runId) return;
  }

  if(S.phase==='AWAIT_MINE'){
    await sleep(reduced?80:420);
    if(my!==runId) return;
    S = Bot.decide(S,p.bot)==='place' ? Game.placeMine(S) : Game.skipMine(S);
    sync();
  }

  busy=false; sync();
  maybeBot();
}

applyLang();
})();
</script>
